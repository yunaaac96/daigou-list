<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日本代購購物清單</title>

<!-- 加入主畫面後的 App 外觀 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="theme-color" content="#C33A2E" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="代購清單">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="日本代購的購物清單、訂金流程與對帳工具">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F3EF; --card:#FFFFFF; --ink:#1A1C19; --ink2:#60655C; --ink3:#8D9289;
  --rule:#DCDED6; --rule2:#EAEBE5;
  --shu:#C33A2E;      /* 朱 — 支出・提醒 */
  --amber:#A8700F;    /* 琥珀 — 等訂金・待退 */
  --matcha:#3D6B4E;   /* 深綠 — 已購・利潤 */
  --gold:#8E6B1F;     /* 金 — 退稅 */
  --shadow:0 1px 0 rgba(26,28,25,.05), 0 2px 10px rgba(26,28,25,.05);
  --r:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#15171A; --card:#1E2126; --ink:#ECEEE8; --ink2:#A2A89C; --ink3:#767C70;
    --rule:#2E333A; --rule2:#272B31;
    --shu:#E4756A; --matcha:#79B98E; --gold:#D4A94F; --amber:#D9A445;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 2px 10px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --paper:#15171A; --card:#1E2126; --ink:#ECEEE8; --ink2:#A2A89C; --ink3:#767C70;
  --rule:#2E333A; --rule2:#272B31;
  --shu:#E4756A; --matcha:#79B98E; --gold:#D4A94F; --amber:#D9A445;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 2px 10px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
body{
  margin:0; height:100%; background:var(--paper); color:var(--ink);
  font-family:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.55; -webkit-text-size-adjust:100%;
}
.jp{font-family:"Noto Sans JP","Noto Sans TC",sans-serif}
.num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--shu); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

/* ---------- 版頭 ---------- */
.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  background:var(--paper); border-bottom:1px solid var(--rule);
}
.wrap{max-width:1100px; margin:0 auto; padding:0 14px}
.brand{display:flex; align-items:center; gap:8px; padding:12px 0 8px; min-width:0}
.brand h1{margin:0; font-size:17px; font-weight:700; letter-spacing:.01em; white-space:nowrap; flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis}
.brand .sub{font-size:12px; color:var(--ink3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:0 1 auto; min-width:0}
.brand .spacer{flex:1 1 0; min-width:0}
.brand .iconbtn{flex:0 0 auto}   /* 按鈕永遠不被壓縮或推出畫面 */
@media (max-width:620px){
  .brand h1{font-size:15.5px}
  .brand .sub{display:none}      /* 匯率在設定頁與檔期列都看得到，這裡讓位給按鈕 */
  .brand .iconbtn{padding:5px 8px; font-size:12px}
}
@media (max-width:380px){
  .brand h1{font-size:14px}
}
.iconbtn{
  background:transparent; border:1px solid var(--rule); border-radius:9px;
  padding:5px 9px; font-size:12.5px; color:var(--ink2);
}
.iconbtn:hover{border-color:var(--ink3)}

.tripbar{display:flex; align-items:center; gap:7px; padding:0 0 9px}
.tripbar select{
  background:var(--card); border:1px solid var(--rule); border-radius:9px;
  padding:6px 9px; font-size:14px; font-weight:700; max-width:58vw;
}
.tripmeta{font-size:11.5px; color:var(--ink3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tabs{display:flex; gap:2px; padding-bottom:0}
.tag.trip{border-color:color-mix(in srgb,var(--gold) 60%,transparent); color:var(--gold)}
.tripcard{background:var(--card); border:1px solid var(--rule); border-radius:11px; padding:12px 13px; margin-bottom:9px}
.tripcard.arch{opacity:.6}
.tripcard .th{display:flex; align-items:center; gap:9px; flex-wrap:wrap}
.tripcard .th b{font-size:14.5px}
.tripcard .th .sp{flex:1}
.tripcard .meta{font-size:11.5px; color:var(--ink3); margin-top:3px}
.tripcard .sums{display:flex; gap:14px; flex-wrap:wrap; margin-top:8px; font-size:12px}
.tripcard .sums span b{font-variant-numeric:tabular-nums}
.tab{
  background:none; border:none; border-bottom:2px solid transparent;
  padding:7px 13px 9px; font-size:14px; font-weight:500; color:var(--ink3);
}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--shu)}
.tab .pill{
  display:inline-block; min-width:18px; margin-left:5px; padding:0 5px;
  background:var(--shu); color:#fff; border-radius:9px;
  font-size:11px; font-weight:700; line-height:17px; text-align:center;
}

/* ---------- 統計 ---------- */
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--rule); border-bottom:1px solid var(--rule)}
.stat{background:var(--paper); padding:9px 12px 10px}
.stat .k{font-size:11px; color:var(--ink3); white-space:nowrap}
.stat .v{font-size:16px; font-weight:700; line-height:1.3; letter-spacing:-.01em}
.stat.out .v{color:var(--ink)}
.stat.tax .v{color:var(--gold)}
.stat.in  .v{color:var(--ink)}
.stat.net .v{color:var(--matcha)}
@media (max-width:700px){
  /* 統計改成可左右滑的一列，避免佔掉太多畫面 */
  .stats{display:flex; overflow-x:auto; scrollbar-width:none; gap:1px}
  .stats::-webkit-scrollbar{display:none}
  .stat{flex:0 0 42%; min-width:132px}
  .stat .v{font-size:15px}
}

/* ---------- 篩選 ---------- */
.filters{display:flex; gap:7px; overflow-x:auto; padding:10px 0 11px; scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters input,.filters select{
  background:var(--card); border:1px solid var(--rule); border-radius:9px;
  padding:7px 9px; font-size:13px; flex:0 0 auto; max-width:46vw;
}
.filters input{flex:1 1 150px; min-width:130px}
.flow{display:flex; gap:6px; overflow-x:auto; padding:0 0 12px; scrollbar-width:none}
.flow::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto; background:var(--card); border:1px solid var(--rule);
  border-radius:999px; padding:5px 12px; font-size:12.5px; color:var(--ink2);
  display:flex; align-items:center; gap:6px;}
.fchip b{font-weight:700; font-variant-numeric:tabular-nums}
.fchip[data-on="1"]{border-width:1.5px}
.fchip.go{color:var(--matcha); border-color:color-mix(in srgb,var(--matcha) 55%,transparent)}
.fchip.wait{color:var(--amber); border-color:color-mix(in srgb,var(--amber) 55%,transparent)}
.fchip.mid{color:var(--shu); border-color:color-mix(in srgb,var(--shu) 45%,transparent)}
.fchip.alert{color:var(--shu); border-color:var(--shu); font-weight:500}
.chipclear{
  background:var(--shu); color:#fff; border:none; border-radius:9px;
  padding:7px 11px; font-size:13px; flex:0 0 auto;
}

/* ---------- 清單 ---------- */
main{padding:14px 0 100px}
.grid{display:grid; gap:11px; grid-template-columns:1fr}
@media (min-width:720px){.grid{grid-template-columns:1fr 1fr}}
@media (min-width:1060px){.grid{grid-template-columns:1fr 1fr 1fr}}

.item{
  background:var(--card); border:1px solid var(--rule); border-radius:var(--r);
  box-shadow:var(--shadow); display:flex; overflow:hidden;
}
.item.done{opacity:.62}
/* 左側數量標條：價格標籤的視覺來源 */
.qtybar{
  flex:0 0 46px; background:var(--rule2); border-right:1px dashed var(--rule);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  padding:8px 0;
}
.qtybar b{font-size:21px; font-weight:700; line-height:1}
.qtybar span{font-size:10px; color:var(--ink3)}
.item.self .qtybar{background:var(--rule2)}
.item.s-deposit_wait .qtybar{background:color-mix(in srgb,var(--amber) 15%,var(--card))}
.item.s-deposit_paid .qtybar{background:color-mix(in srgb,var(--matcha) 15%,var(--card))}
.item.s-bought      .qtybar{background:color-mix(in srgb,var(--shu) 12%,var(--card))}
.item.s-unavailable .qtybar{background:color-mix(in srgb,var(--shu) 18%,var(--card))}
.item.s-settled .qtybar,.item.s-refunded .qtybar,.item.s-todo .qtybar{background:var(--rule2)}
.item.s-deposit_wait{border-style:dashed}
.item.s-deposit_paid{border-color:color-mix(in srgb,var(--matcha) 45%,var(--rule)); border-width:1.5px}

.body{flex:1; min-width:0; padding:11px 12px 10px}
.head{display:flex; gap:10px}
.thumb{
  flex:0 0 54px; height:54px; border-radius:9px; background:var(--rule2);
  border:1px solid var(--rule); object-fit:cover; display:block;
}
.noimg{
  flex:0 0 54px; height:54px; border-radius:9px; background:var(--rule2);
  border:1px dashed var(--rule); display:grid; place-items:center;
  font-size:10px; color:var(--ink3);
}
.names{min-width:0; flex:1}
.nm{font-size:15px; font-weight:700; line-height:1.3; word-break:break-word}
.nj{font-size:12.5px; color:var(--ink2); line-height:1.35; word-break:break-word}
.spec{font-size:11.5px; color:var(--ink3); margin-top:2px}

.meta{display:flex; flex-wrap:wrap; gap:5px; margin:8px 0 2px}
.tag{
  font-size:11px; padding:2px 7px; border-radius:6px;
  border:1px solid var(--rule); color:var(--ink2); background:transparent;
}
.tag.store{border-color:color-mix(in srgb,var(--ink3) 45%,transparent)}
.tag.cust{border-color:color-mix(in srgb,var(--matcha) 55%,transparent); color:var(--matcha)}
.tag.buy{background:var(--shu); border-color:var(--shu); color:#fff; font-weight:500}
.tag.self{background:var(--ink3); border-color:var(--ink3); color:var(--card); font-weight:500}

/* 金額區：收據式點線引導 */
.money{margin-top:9px; border-top:1px solid var(--rule2); padding-top:8px}
.row{display:flex; align-items:baseline; gap:6px; font-size:12.5px; line-height:1.9}
.row .lab{color:var(--ink3); white-space:nowrap}
.row .dots{flex:1; border-bottom:1px dotted var(--rule); transform:translateY(-3px)}
.row .val{font-weight:500; white-space:nowrap}
.row.tax .val{color:var(--gold)}
.row.total{font-size:14px; border-top:1px solid var(--rule2); margin-top:5px; padding-top:5px}
.row.total .lab{color:var(--ink2); font-weight:500}
.row.total .val{font-weight:700; color:var(--matcha)}
.row.dep .val{color:var(--amber)}
.row.paid .val{color:var(--ink); font-weight:700}
.row.actual .lab{color:var(--matcha)}
.row.actual .val{color:var(--matcha); font-weight:700}
.rate{margin-top:7px; font-size:11px; color:var(--ink3); font-variant-numeric:tabular-nums}
.rate.diff{color:var(--amber)}
.row.bal .val{color:var(--shu)}
.row.total.loss .val{color:var(--shu)}

.acts{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.act{
  background:transparent; border:1px solid var(--rule); border-radius:8px;
  padding:5px 10px; font-size:12.5px; color:var(--ink2);
}
.act:hover{border-color:var(--ink3); color:var(--ink)}
.act.go{border-color:color-mix(in srgb,var(--matcha) 50%,transparent); color:var(--matcha)}
.act.state{border-color:color-mix(in srgb,var(--matcha) 55%,transparent); color:var(--matcha); font-weight:500}
.act.warn{border-color:color-mix(in srgb,var(--amber) 55%,transparent); color:var(--amber)}
.act.del:hover{border-color:var(--shu); color:var(--shu)}

/* 狀態印章 */
.stamp{
  position:absolute; right:10px; top:9px; font-size:10.5px; font-weight:700;
  padding:2px 7px; border-radius:5px; letter-spacing:.04em;
}
.item{position:relative}
.stamp.go{background:var(--matcha); color:var(--card)}
.stamp.wait{border:1.5px solid var(--amber); color:var(--amber)}
.stamp.mid{border:1.5px solid var(--shu); color:var(--shu)}
.stamp.done{border:1.5px solid var(--ink3); color:var(--ink3)}
.stamp.alert{background:var(--shu); color:#fff}

/* ---------- 空狀態 ---------- */
.empty{
  border:1px dashed var(--rule); border-radius:var(--r); padding:34px 20px;
  text-align:center; color:var(--ink2); background:var(--card);
}
.empty h3{margin:0 0 6px; font-size:16px; color:var(--ink)}
.empty p{margin:0 0 14px; font-size:13.5px}
.linkbtn{background:none; border:none; color:var(--shu); text-decoration:underline; font-size:13.5px; padding:0}

/* ---------- 對帳 ---------- */
.ledger{background:var(--card); border:1px solid var(--rule); border-radius:var(--r); margin-bottom:12px; overflow:hidden}
.lhead{display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--rule2); flex-wrap:wrap}
.lhead h3{margin:0; font-size:15.5px; font-weight:700}
.lhead .cnt{font-size:12px; color:var(--ink3)}
.lhead .spacer{flex:1}
.lsum{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--rule2)}
.lsum div{background:var(--card); padding:9px 14px}
.lsum .k{font-size:11px; color:var(--ink3)}
.lsum .v{font-size:15px; font-weight:700}
.lsum .v.net{color:var(--matcha)}
.lflow{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--rule2); border-top:1px solid var(--rule2)}
.lflow div{background:var(--card); padding:8px 14px}
.lflow .k{font-size:11px; color:var(--ink3)}
.lflow .v{font-size:13.5px; font-weight:700}
.lflow .v.wait{color:var(--amber)} .lflow .v.go{color:var(--matcha)} .lflow .v.mid{color:var(--shu)}
@media (max-width:620px){.lflow{grid-template-columns:repeat(2,1fr)}}
table.lt{width:100%; border-collapse:collapse; font-size:12.5px}
table.lt th,table.lt td{padding:7px 14px; text-align:left; border-top:1px solid var(--rule2)}
table.lt th{font-size:11px; color:var(--ink3); font-weight:500}
table.lt td.n{text-align:right; white-space:nowrap}


/* ---------- 檔期管理 ---------- */
function newTrip(){
  const n=prompt("新檔期名稱（例如：2026/10 東京）");
  if(n===null) return null;
  const name=n.trim(); if(!name){ toast("請輸入名稱"); return null; }
  const t={id:newId("t"),name,start:"",end:"",rateSell:null,rateReal:null,note:"",archived:false};
  S.trips.push(t); S.cur=t.id; save(); cloudPutTrip(t); render();
  toast("已建立「"+name+"」");
  return t;
}
function tripSums(id){
  const arr=tripItems(id);
  let cost=0,charge=0,profit=0,depWait=0,balWait=0;
  arr.forEach(it=>{
    const m=calc(it);
    if(it.state==="refunded") return;
    cost+=m.cost; charge+=m.charge; profit+=m.profit;
    if(it.state==="deposit_wait") depWait+=m.deposit;
    if(it.state==="bought") balWait+=m.balance;
  });
  return {n:arr.length,cost,charge,profit,depWait,balWait};
}
function renderTrips(){
  const box=document.getElementById("tripList"); if(!box) return;
  if(!S.trips.length){ box.innerHTML=`<p class="hint">還沒有檔期。按上面的「新增檔期」開始。</p>`; return; }
  box.innerHTML=S.trips.map(t=>{
    const u=tripSums(t.id);
    return `<div class="tripcard ${t.archived?"arch":""}">
      <div class="th">
        <b>${esc(t.name)}</b>
        ${t.archived?`<span class="tag">已封存</span>`:""}
        ${S.cur===t.id?`<span class="tag cust">目前</span>`:""}
        <span class="sp"></span>
        <button class="act" data-t="edit" data-id="${t.id}">編輯</button>
        <button class="act" data-t="arch" data-id="${t.id}">${t.archived?"取消封存":"封存"}</button>
        <button class="act del" data-t="del" data-id="${t.id}">刪除</button>
      </div>
      <div class="meta">${t.start||t.end?`${t.start||"?"} – ${t.end||"?"}　·　`:""}${u.n} 筆${(t.rateSell!=null&&t.rateSell!=="")?`　·　檔期匯率 ${t.rateSell}`:""}${t.note?`　·　${esc(t.note)}`:""}</div>
      <div class="sums">
        <span>先墊 <b>${twd(u.cost)}</b></span>
        <span>應收 <b>${twd(u.charge)}</b></span>
        <span style="color:var(--amber)">待收訂金 <b>${twd(u.depWait)}</b></span>
        <span style="color:var(--shu)">待收尾款 <b>${twd(u.balWait)}</b></span>
        <span style="color:var(--matcha)">賺 <b>${twd(u.profit)}</b></span>
      </div>
    </div>`;
  }).join("");
  box.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>tripAction(b.dataset.t,b.dataset.id));
}
function tripAction(act,id){
  const t=trip(id); if(!t) return;
  if(act==="edit"){
    const name=prompt("檔期名稱",t.name); if(name===null) return;
    const start=prompt("出發日（YYYY-MM-DD，可留空）",t.start||""); if(start===null) return;
    const end=prompt("回國日（YYYY-MM-DD，可留空）",t.end||""); if(end===null) return;
    const rs=prompt("這個檔期的代購匯率（留空＝用今日設定）",t.rateSell??""); if(rs===null) return;
    const rr=prompt("這個檔期的實際匯率（留空＝用今日設定）",t.rateReal??""); if(rr===null) return;
    t.name=name.trim()||t.name; t.start=start.trim(); t.end=end.trim();
    t.rateSell=rs.trim()===""?null:+rs; t.rateReal=rr.trim()===""?null:+rr;
    save(); cloudPutTrip(t); render(); renderSettings(); toast("已更新");
  }
  if(act==="arch"){
    t.archived=!t.archived;
    if(t.archived && S.cur===id){ const o=S.trips.find(x=>!x.archived); S.cur=o?o.id:"all"; }
    save(); cloudPutTrip(t); render(); renderSettings();
    toast(t.archived?"已封存":"已取消封存");
  }
  if(act==="del"){
    const n=tripItems(id).length;
    if(n){
      const move=confirm(`「${t.name}」底下還有 ${n} 筆商品。\n\n按「確定」把這些商品搬到另一個檔期；按「取消」連同商品一起刪除。`);
      if(move){
        const others=S.trips.filter(x=>x.id!==id);
        if(!others.length){ toast("沒有其他檔期可以搬，請先新增一個"); return; }
        const to=prompt("搬到哪個檔期？請輸入編號：\n"+others.map((x,i)=>`${i+1}. ${x.name}`).join("\n"),"1");
        const k=others[(+to||1)-1]; if(!k) return;
        tripItems(id).forEach(it=>{ it.tripId=k.id; cloudPut(it); });
      } else {
        if(!confirm(`確定要連同 ${n} 筆商品一起刪除？這個動作無法復原。`)) return;
        tripItems(id).forEach(it=>cloudDel(it.id));
        S.items=S.items.filter(it=>it.tripId!==id);
      }
    }
    S.trips=S.trips.filter(x=>x.id!==id);
    if(S.cur===id) S.cur=S.trips.length?S.trips[0].id:"all";
    save(); cloudDelTrip(id); render(); renderSettings(); toast("已刪除檔期");
  }
}

/* ---------- 設定 ---------- */

  width:100%; background:var(--paper); border:1px solid var(--rule);

<script>
"use strict";
const KEY="daigou.jp.v1";
const DEF_SET={rateReal:0.215, rateSell:0.23, taxRate:10, base:"incl", depositPct:50,
               cardFeePct:1.5, refundMode:"store", theme:""};
const ST={
  deposit_wait:{t:"待收訂金", chip:"等訂金",   tone:"wait",  next:"deposit_paid", btn:"收到訂金了"},
  deposit_paid:{t:"可以買",   chip:"可以買",   tone:"go",    next:"bought",       btn:"買到了"},
  bought:      {t:"待收尾款", chip:"待收尾款", tone:"mid",   next:"settled",      btn:"尾款收到了"},
  settled:     {t:"已結清",   chip:"已結清",   tone:"done",  next:"deposit_wait", btn:"重設"},
  unavailable: {t:"買不到",   chip:"買不到",   tone:"alert", next:"refunded",     btn:"訂金已退"},
  refunded:    {t:"已退訂金", chip:"已退訂金", tone:"done",  next:"deposit_wait", btn:"重新開始"},
  todo:        {t:"待買",     chip:"自購待買", tone:"wait",  next:"bought",       btn:"買到了"}
};
const FLOW_ORDER=["deposit_paid","deposit_wait","todo","bought","unavailable","settled","refunded"];
let S={items:[], trips:[], cur:"", set:{...DEF_SET}, meta:{backupAt:0, backupCount:0}};
let editId=null, pendingImg=null;

/* ---------- 儲存 ---------- */
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){
      const d=JSON.parse(raw);
      S.items=Array.isArray(d.items)?d.items:[];
      S.set={...DEF_SET,...(d.set||{})};
      S.meta={backupAt:0, backupCount:0, ...(d.meta||{})};
      S.trips=Array.isArray(d.trips)?d.trips:[];
      S.cur=d.cur||"";
      S.items.forEach(it=>{
        if(it.state==="todo" && it.kind==="buy") it.state="deposit_wait";
        if(it.depOv===undefined) it.depOv=null;
        if(it.paidYen===undefined) it.paidYen=null;
        if(it.cardTwd===undefined) it.cardTwd=null;
        if(it.rateSell===undefined) it.rateSell=S.set.rateSell;   /* 既有資料凍結在目前匯率 */
        if(it.rateReal===undefined) it.rateReal=S.set.rateReal;
        if(it.rateLocked===undefined) it.rateLocked=!["deposit_wait","todo"].includes(it.state);
        if(it.orderDate===undefined) it.orderDate=new Date(it.ts||Date.now()).toISOString().slice(0,10);
        if(it.depTaken===undefined) it.depTaken=["deposit_paid","bought","settled","unavailable"].includes(it.state);
      });
    }
  }catch(e){ console.warn("讀取失敗",e); }
}
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }
  catch(e){ toast("儲存空間已滿，請先刪除幾張商品圖或匯出備份"); }
  paintBackup();
}

/* ========= 備份提醒 =========
   資料只存在這台裝置，所以「多久沒備份」是唯一要盯的風險指標 */
const DAY=86400000;
function bkAgeDays(){ return S.meta.backupAt ? Math.floor((Date.now()-S.meta.backupAt)/DAY) : null; }
function bkDrift(){ return S.items.length - (S.meta.backupCount||0); }
function paintBackup(){
  const b=document.getElementById("bkBtn"); if(!b) return;
  const d=bkAgeDays();
  let cls="", txt;
  if(!S.items.length){ txt="備份"; }
  else if(d===null){ txt="未備份"; cls="bad"; }
  else if(d>=7){ txt=`備份 ${d} 天前`; cls="bad"; }
  else if(d>=3){ txt=`備份 ${d} 天前`; cls="warn"; }
  else { txt= d===0?"今天已備份":`備份 ${d} 天前`; cls="ok"; }
  b.textContent=txt; b.className="iconbtn"+(cls?" "+cls:"");
  b.title="點一下立即匯出備份";
  paintBanner();
}
function paintBanner(){
  const el=document.getElementById("banner"); if(!el) return;
  if(fbState==="ready"){            /* 已設定 Firebase 但還沒登入 */
    el.className="warn";
    el.innerHTML=`<h4>還沒登入，目前只存在這台裝置</h4>
      <p>登入後手機和電腦會自動同步。兩台請登入同一個 Google 帳號。</p>
      <div class="btnrow"><button class="btn primary" id="bnIn">用 Google 登入</button>
      <button class="btn" id="bnSkip">先不要</button></div>`;
    document.getElementById("bnIn").onclick=cloudSignIn;
    document.getElementById("bnSkip").onclick=()=>{ el.className="hide"; el.innerHTML=""; };
    return;
  }
  const d=bkAgeDays(), drift=bkDrift();
  let lvl=null, msg="";
  if(S.items.length && d===null){
    lvl="bad"; msg=`目前有 ${S.items.length} 筆資料從來沒有備份過。資料只存在這台裝置，清除瀏覽資料或換手機就會全部不見。`;
  } else if(d!==null && d>=7){
    lvl="bad"; msg=`已經 ${d} 天沒備份${drift>0?`，期間新增了 ${drift} 筆`:""}。建議現在匯出一份。`;
  } else if(d!==null && d>=3 && drift>0){
    lvl="warn"; msg=`上次備份是 ${d} 天前，之後又新增了 ${drift} 筆。`;
  }
  if(!lvl){ el.className="hide"; el.innerHTML=""; return; }
  el.className=lvl;
  el.innerHTML=`<h4>該備份了</h4><p>${msg}</p>
    <div class="btnrow">
      <button class="btn primary" id="bnExp">立即匯出備份</button>
      <button class="btn" id="bnLater">今天先不要</button>
    </div>`;
  document.getElementById("bnExp").onclick=exportBackup;
  document.getElementById("bnLater").onclick=()=>{ el.className="hide"; el.innerHTML=""; };
}
function exportBackup(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="代購清單備份_"+new Date().toISOString().slice(0,10)+".json";
  a.click(); URL.revokeObjectURL(a.href);
  S.meta.backupAt=Date.now(); S.meta.backupCount=S.items.length;
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
  paintBackup(); toast("備份檔已下載，記得存到雲端硬碟或傳給自己");
}
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2200);
}

/* ---------- 檔期 ---------- */
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function migrateTrips(){
  if(!Array.isArray(S.trips)) S.trips=[];
  const orphan=S.items.filter(i=>!i.tripId);
  if(orphan.length && !S.trips.length){
    const t={id:newId("t"),name:"未分類",start:"",end:"",rateSell:null,rateReal:null,note:"",archived:false};
    S.trips=[t]; orphan.forEach(i=>i.tripId=t.id);
  } else if(orphan.length){
    orphan.forEach(i=>i.tripId=S.trips[0].id);
  }
  if(!S.cur || (S.cur!=="all" && !S.trips.some(t=>t.id===S.cur)))
    S.cur = S.trips.length ? S.trips[0].id : "all";
}
const trip=id=>S.trips.find(t=>t.id===id)||null;
const tripName=id=>{const t=trip(id); return t?t.name:"未分類";};
const curTrip=()=>S.cur==="all"?null:trip(S.cur);
function tripItems(id){ return S.items.filter(i=>i.tripId===id); }

/* ---------- 計算 ---------- */
/* 匯率以單筆為準，沒有才退回設定值。報價後就該凍結，避免事後改設定影響已成交的單 */
const RS=it=>(it&&it.rateSell!=null&&it.rateSell!=="")?+it.rateSell:(+S.set.rateSell||0);
const RR=it=>(it&&it.rateReal!=null&&it.rateReal!=="")?+it.rateReal:(+S.set.rateReal||0);
/* 新增商品時帶入的匯率：檔期有設就用檔期的，否則用今日設定 */
const defRS=()=>{const t=curTrip(); return (t&&t.rateSell!=null&&t.rateSell!=="")?t.rateSell:S.set.rateSell;};
const defRR=()=>{const t=curTrip(); return (t&&t.rateReal!=null&&t.rateReal!=="")?t.rateReal:S.set.rateReal;};
const today=()=>new Date().toISOString().slice(0,10);
const yen=n=>"¥"+Math.round(n).toLocaleString("ja-JP");
const twd=n=>"NT$"+Math.round(n).toLocaleString("zh-Hant-TW");
function calc(it){
  const qty=Math.max(1,+it.qty||1), price=+it.price||0;
  const sub=price*qty;
  const r=(+S.set.taxRate||0)/100;
  const autoTax = r>0 ? sub/(1+r)*r : 0;
  const tax = (it.taxOv===""||it.taxOv==null) ? autoTax : +it.taxOv;
  /* 日圓實際支出：有填實付就用實付，店頭免稅＝已折抵、機場退稅＝再扣回退稅 */
  const paid = (it.paidYen===""||it.paidYen==null) ? null : +it.paidYen;
  const yenOut = paid!=null
    ? (S.set.refundMode==="airport" ? Math.max(0, paid - paid/(1+r)*r) : paid)
    : (sub - tax);
  const fee = 1 + (+S.set.cardFeePct||0)/100;
  const costEst = yenOut*RR(it)*fee;
  const card = (it.cardTwd===""||it.cardTwd==null) ? null : +it.cardTwd;
  const cost = card!=null ? card : costEst;
  const base = S.set.base==="excl" ? (sub-tax) : sub;
  const autoCharge = base*RS(it);
  const charge = it.kind==="self" ? 0
    : ((it.chargeOv===""||it.chargeOv==null) ? autoCharge : +it.chargeOv);
  const dp=(+S.set.depositPct||0)/100;
  const deposit = it.kind==="self" ? 0 : ((it.depOv===""||it.depOv==null) ? charge*dp : +it.depOv);
  return {qty, sub, tax, paid, yenOut, costEst, cost, isActual: card!=null,
          charge, deposit, balance:Math.max(0,charge-deposit),
          profit: it.kind==="self" ? 0 : charge-cost};
}

function filtered(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const c=document.getElementById("fCust").value, st=document.getElementById("fStore").value;
  const ca=document.getElementById("fCat").value, se=document.getElementById("fState").value;
  const ki=document.getElementById("fKind").value;
  document.getElementById("clearF").classList.toggle("hide",!(q||c||st||ca||se||ki));
  return S.items.filter(it=>{
    if(S.cur!=="all" && it.tripId!==S.cur) return false;
    if(c && (it.customer||"")!==c) return false;
    if(st && (it.store||"")!==st) return false;
    if(ca && (it.category||"")!==ca) return false;
    if(se && it.state!==se) return false;
    if(ki && it.kind!==ki) return false;
    if(q){
      const hay=[it.nameZh,it.nameJa,it.spec,it.note,it.store,it.customer,it.category].join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function renderFlowChips(){
  const box=document.getElementById("flowChips");
  const cur=document.getElementById("fState").value, counts={};
  S.items.forEach(it=>{counts[it.state]=(counts[it.state]||0)+1;});

    const d=ST[k];
    return '<button class="fchip '+d.tone+'" data-state="'+k+'" data-on="'+(cur===k?1:0)+'">'+d.chip+'<b>'+counts[k]+'</b></button>';
  });

      sel.value = sel.value===b.dataset.state ? "" : b.dataset.state;
      render();

function flowSums(list){
  let depWait=0, depHeld=0, balWait=0, depRefund=0;
  list.forEach(it=>{
    if(it.kind!=="buy") return;
    const m=calc(it);
    if(it.state==="deposit_wait") depWait+=m.deposit;
    if(["deposit_paid","bought","unavailable"].includes(it.state)) depHeld+=m.deposit;
    if(it.state==="bought") balWait+=m.balance;
    if(it.state==="unavailable") depRefund+=m.deposit;
  });
  return {depWait, depHeld, balWait, depRefund};
}
function renderStats(list){
  let cost=0,tax=0,profit=0;
  list.forEach(it=>{const m=calc(it); cost+=m.cost; tax+=m.tax; if(it.state!=="refunded") profit+=m.profit;});
  const f=flowSums(list);
  document.getElementById("stats").innerHTML=`
    <div class="stat"><div class="k">待收訂金</div><div class="v num" style="color:var(--amber)">${twd(f.depWait)}</div></div>
    <div class="stat"><div class="k">手上訂金</div><div class="v num" style="color:var(--matcha)">${twd(f.depHeld)}</div></div>
    <div class="stat"><div class="k">待收尾款</div><div class="v num" style="color:var(--shu)">${twd(f.balWait)}</div></div>
    <div class="stat net"><div class="k">預估賺</div><div class="v num">${twd(profit)}</div></div>
    <div class="stat"><div class="k">先墊的錢</div><div class="v num">${twd(cost)}</div></div>
    <div class="stat tax"><div class="k">可退稅</div><div class="v num">${yen(tax)}</div></div>
    <div class="stat"><div class="k">待退訂金</div><div class="v num" style="color:${f.depRefund?'var(--shu)':'var(--ink3)'}">${twd(f.depRefund)}</div></div>
    <div class="stat"><div class="k">項目數</div><div class="v num">${list.length}</div></div>`;
}

function handle(act,it){
  if(act==="cycle"){
    const st=ST[it.state]||ST.deposit_wait;
    if(it.kind==="self"){ it.state = it.state==="bought" ? "todo" : "bought"; }
    else { it.state=st.next; }
    it.depTaken=["deposit_paid","bought","settled","unavailable"].includes(it.state);
    if(!["deposit_wait","todo"].includes(it.state)) it.rateLocked=true;
    save(); cloudPut(it); render(); toast("已改為「"+ST[it.state].t+"」"+(it.state==="deposit_paid"?"，匯率已鎖定":""));
  }
  if(act==="miss"){
    const had = it.depTaken || it.state==="deposit_paid";
    it.state = had ? "unavailable" : "refunded";
    save(); cloudPut(it); render();
    toast(had ? "已標為買不到，記得退訂金" : "已標為買不到（訂金尚未收）");
  }
  if(act==="back"){ it.state="deposit_paid"; save(); cloudPut(it); render(); toast("已退回「可以買」"); }
  if(act==="del"){
    if(confirm(`刪除「${it.nameZh||"這筆"}」？`)){
      S.items=S.items.filter(x=>x.id!==it.id); save(); cloudDel(it.id); render(); toast("已刪除");
    }
  }
  if(act==="edit") openSheet(it);
  if(act==="mapItem"){
    const kw=[it.nameJa||it.nameZh, it.store||"", it.nameJa?"販売店":""].filter(Boolean).join(" ");
    openMap(kw);
  }
  if(act==="mapStore") openMap(it.store);
}
function openMap(kw){
  if(!kw){toast("這筆沒有可搜尋的名稱");return;}
  window.open("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(kw),"_blank","noopener");
}

    const im=new Image();
    im.onload=()=>{

      const c=document.createElement("canvas");
      c.width=Math.round(im.width*sc); c.height=Math.round(im.height*sc);

};

/* ---------- 對帳 ---------- */
function renderLedger(){
  const box=document.getElementById("viewLedger");
  const buys=S.items.filter(i=>i.kind==="buy" && (S.cur==="all"||i.tripId===S.cur));
  if(!buys.length){ box.innerHTML=`<div class="empty"><h3>還沒有代購項目</h3><p>新增商品時把類型選成「代購」並填上客人，這裡就會自動分組結帳。</p></div>`; return; }
  const groups={};
  buys.forEach(it=>{ const k=it.customer||"（未指定客人）"; (groups[k]=groups[k]||[]).push(it); });
  box.innerHTML=Object.keys(groups).sort().map(name=>{
    const arr=groups[name].slice().sort((x,y)=>ORDER[x.state]-ORDER[y.state]);
    let cost=0,charge=0,profit=0,qty=0;
    const rows=arr.map(it=>{
      const m=calc(it); qty+=m.qty;
      if(it.state!=="refunded"){ cost+=m.cost; charge+=m.charge; profit+=m.profit; }
      const st=ST[it.state];
      const col = st.tone==="go"?"var(--matcha)" : st.tone==="wait"?"var(--amber)"
                : (st.tone==="alert"||st.tone==="mid")?"var(--shu)" : "var(--ink3)";
      return `<tr>
        <td>${esc(it.nameZh)}${it.spec?`<div style="color:var(--ink3);font-size:11.5px">${esc(it.spec)}</div>`:""}</td>
        <td class="n num">${m.qty}</td>
        <td class="n num">${twd(m.deposit)}</td>
        <td class="n num">${twd(m.balance)}</td>
        <td class="n num" style="color:var(--ink3)">${RS(it)}</td>
        <td class="n" style="color:${col}">${st.t}</td>
      </tr>`;
    }).join("");
    const f=flowSums(arr);
    return `<section class="ledger">
      <div class="lhead">
        <h3>${esc(name)}</h3><span class="cnt num">${arr.length} 項 · ${qty} 件${(()=>{const rs=[...new Set(arr.map(x=>RS(x)))]; return rs.length>1?" · "+rs.length+" 種匯率":" · 匯率 "+rs[0];})()}</span>
        <span class="spacer"></span>
        <button class="act" data-copy="${esc(name)}" data-mode="deposit">複製訂金通知</button>
        <button class="act" data-copy="${esc(name)}" data-mode="final">複製尾款結算</button>
      </div>
      <div class="lsum">
        <div><div class="k">先墊</div><div class="v num">${twd(cost)}</div></div>
        <div><div class="k">應收總額</div><div class="v num">${twd(charge)}</div></div>
        <div><div class="k">賺</div><div class="v num net">${twd(profit)}</div></div>
      </div>
      <div class="lflow">
        <div><div class="k">待收訂金</div><div class="v wait num">${twd(f.depWait)}</div></div>
        <div><div class="k">手上訂金</div><div class="v go num">${twd(f.depHeld)}</div></div>
        <div><div class="k">待收尾款</div><div class="v mid num">${twd(f.balWait)}</div></div>
        <div><div class="k">待退訂金</div><div class="v ${f.depRefund?"mid":""} num">${twd(f.depRefund)}</div></div>
      </div>
      <table class="lt"><thead><tr><th>商品</th><th class="n">件</th><th class="n">訂金</th><th class="n">尾款</th><th class="n">匯率</th><th class="n">狀態</th></tr></thead><tbody>${rows}</tbody></table>
    </section>`;
  }).join("");
  box.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>copyFor(b.dataset.copy,b.dataset.mode));
}

function copyFor(name,mode){
  const arr=S.items.filter(i=>i.kind==="buy" && (i.customer||"（未指定客人）")===name);
  let txt="";
  if(mode==="deposit"){
    const wait=arr.filter(i=>i.state==="deposit_wait");
    if(!wait.length){ toast("這位客人沒有待收訂金的項目"); return; }
    let dep=0,chg=0;
    const lines=wait.map((it,i)=>{
      const m=calc(it); dep+=m.deposit; chg+=m.charge;
      return (i+1)+". "+it.nameZh+(it.spec?"（"+it.spec+"）":"")+" ×"+m.qty+"　"+twd(m.charge);
    });
    const rs=[...new Set(wait.map(x=>RS(x)))];
    const tn=S.cur==="all"?"":`（${tripName(S.cur)}）`;
    txt="【"+name+"】"+tn+"代購確認\n"+lines.join("\n")
      +"\n—\n總金額 "+twd(chg)+"\n訂金 "+twd(dep)+"（"+S.set.depositPct+"%）"
      +"\n換算匯率 "+rs.join("／")
      +"\n收到訂金後開始採購；若當地缺貨買不到，訂金會全額退回。";
  }else{
    const live=arr.filter(i=>i.state!=="refunded");
    if(!live.length){ toast("這位客人沒有可結算的項目"); return; }
    let chg=0,dep=0,bal=0,refund=0;
    const lines=live.map((it,i)=>{
      const m=calc(it);
      if(it.state==="unavailable"){ refund+=m.deposit; return (i+1)+". "+it.nameZh+" ×"+m.qty+"　買不到，退訂金 "+twd(m.deposit); }
      chg+=m.charge; dep+=m.deposit; bal+=m.balance;
      return (i+1)+". "+it.nameZh+(it.spec?"（"+it.spec+"）":"")+" ×"+m.qty+"　"+twd(m.charge);
    });
    const tn2=S.cur==="all"?"":`（${tripName(S.cur)}）`;
    txt="【"+name+"】"+tn2+"代購結算\n"+lines.join("\n")
      +"\n—\n商品合計 "+twd(chg)+"\n已收訂金 −"+twd(dep)
      +(refund?"\n退回訂金 −"+twd(refund):"")
      +"\n應付尾款 "+twd(Math.max(0,bal-refund));
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast("已複製，可直接貼到 LINE"),()=>toast("複製失敗，請手動選取"));
  } else { toast("此瀏覽器不支援複製"); }
}

/* ================= Firebase 同步（選用） =================
   沒設定或沒登入時，整個工具就是純本機版，功能不受影響。
   設定後：Firestore 的離線快取會在沒網路時先存本機，連上網自動補傳。 */
let FB=null, UID=null, unsubItems=null, unsubMeta=null, unsubTrips=null, firstSnap=true, fbState="off";
const FBKEY=KEY+".fbcfg";
function builtinCfgText(){
  const e=document.getElementById("fb-config");
  return e ? (e.textContent||"").trim() : "";
}
function fbCfg(){
  try{
    const v=JSON.parse(localStorage.getItem(FBKEY)||"null");
    if(v&&v.apiKey) return v;         /* 這台裝置貼的優先 */
  }catch(e){}
  return parseFbCfg(builtinCfgText()); /* 其次用檔案裡的 */
}
function cfgSource(){
  try{ const v=JSON.parse(localStorage.getItem(FBKEY)||"null"); if(v&&v.apiKey) return "device"; }catch(e){}
  if(parseFbCfg(builtinCfgText())) return "file";
  return builtinCfgText() ? "bad" : "none";
}
/* Firebase 給的是 JS 物件寫法（key 沒引號），所以不能只靠 JSON.parse。
   這裡改成直接把需要的欄位抽出來，整段程式碼貼進來也能用。 */
function parseFbCfg(txt){
  if(!txt) return null;
  try{ const o=JSON.parse(txt); if(o&&o.apiKey&&o.projectId) return o; }catch(e){}
  const keys=["apiKey","authDomain","projectId","storageBucket","messagingSenderId","appId","measurementId","databaseURL"];
  const o={};
  keys.forEach(k=>{
    const m=txt.match(new RegExp("[\"']?"+k+"[\"']?\\s*:\\s*[\"']([^\"']+)[\"']"));
    if(m) o[k]=m[1];
  });
  return (o.apiKey&&o.projectId) ? o : null;
}
function setFbCfg(c){ if(c) localStorage.setItem(FBKEY,JSON.stringify(c)); else localStorage.removeItem(FBKEY); }

const FB_TXT={off:["本機",""],loading:["連線中…",""],ready:["未登入","warn"],
              synced:["已同步","ok"],offline:["離線中","warn"],error:["連線失敗","bad"]};
function paintCloud(){
  const b=document.getElementById("cloudBtn");
  if(typeof paintBanner==="function") setTimeout(paintBanner,0);
  if(!b) return;
  const [t,c]=FB_TXT[fbState]||FB_TXT.off;
  b.textContent=t; b.className="iconbtn"+(c?" "+c:"");
  b.title = fbState==="off" ? "尚未設定雲端同步，資料只存在這台裝置"
          : fbState==="ready" ? "點一下用 Google 登入開始同步" : "點一下開啟同步設定";
}
function cloudInit(){
  const cfg=fbCfg();
  if(!cfg){ fbState="off"; paintCloud(); return; }
  if(!window.__FB){ fbState="error"; paintCloud(); return; }
  const F=window.__FB;
  try{
    fbState="loading"; paintCloud();
    const app=F.initializeApp(cfg);
    const db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})});
    const auth=F.getAuth(app);
    FB={F,app,db,auth};
    F.getRedirectResult(auth).catch(e=>{
      if(e&&e.code&&!String(e.code).includes("no-auth-event")){
        console.warn("轉址登入失敗",e); toast("登入沒有完成："+(e.message||e.code));
      }
    });
    F.onAuthStateChanged(auth,u=>{
      UID=u?u.uid:null;
      if(UID){ firstSnap=true; startSync(); } else { stopSync(); fbState="ready"; }
      paintCloud();
      if(document.getElementById("fbPanel")) renderSettings();
    });
  }catch(e){
    console.warn(e); FB=null; fbState="error"; paintCloud();
    toast("Firebase 設定有問題："+(e.message||e));
  }
}
function stopSync(){
  if(unsubItems){unsubItems();unsubItems=null;}
  if(unsubMeta){unsubMeta();unsubMeta=null;}
  if(unsubTrips){unsubTrips();unsubTrips=null;}
}
function startSync(){
  const {F,db}=FB; stopSync();
  unsubMeta=F.onSnapshot(F.doc(db,"users",UID,"sys","meta"),snap=>{
    if(snap.exists()){ const d=snap.data(); if(d&&d.set){ S.set={...DEF_SET,...d.set}; rateNote(); } }
  },e=>console.warn("設定監聽中斷",e));

  unsubTrips=F.onSnapshot(F.collection(db,"users",UID,"trips"),snap=>{
    const cloud=snap.docs.map(d=>d.data());
    if(cloud.length){ S.trips=cloud; migrateTrips(); persist(); render(); }
  },e=>console.warn("檔期監聽中斷",e));

  unsubItems=F.onSnapshot(F.collection(db,"users",UID,"items"),snap=>{
    const cloud=snap.docs.map(d=>d.data());
    if(firstSnap){
      firstSnap=false;
      if(!cloud.length && S.items.length){                 /* 雲端空的：把本機傳上去 */
        uploadAll(); return;
      }
      if(cloud.length && S.items.length && !sameSet(cloud,S.items)){
        const keepCloud=confirm(`雲端有 ${cloud.length} 筆，這台裝置有 ${S.items.length} 筆，內容不一致。\n\n按「確定」用雲端覆蓋這台；按「取消」把這台的資料也上傳合併。`);
        if(!keepCloud){ uploadAll(); return; }
      }
    }
    S.items=cloud; persist(); render();
    fbState = snap.metadata.fromCache ? "offline" : "synced";
    paintCloud();
  },e=>{ console.warn("資料監聽中斷",e); fbState="error"; paintCloud(); });
}
const sameSet=(a,b)=>a.length===b.length && a.every(x=>b.some(y=>y.id===x.id));
async function uploadAll(){
  if(!UID) return;
  const {F,db}=FB;
  try{
    for(const t of S.trips) await F.setDoc(F.doc(db,"users",UID,"trips",t.id),t);
    for(const it of S.items) await F.setDoc(F.doc(db,"users",UID,"items",it.id),it);
    await cloudSettings();
    toast("已上傳 "+S.items.length+" 筆到雲端");
  }catch(e){ console.warn(e); toast("上傳失敗："+(e.message||e)); }
}
async function cloudPut(it){
  if(!UID||!it) return;
  try{ await FB.F.setDoc(FB.F.doc(FB.db,"users",UID,"items",it.id),it); }catch(e){ console.warn(e); }
}
async function cloudDel(id){
  if(!UID||!id) return;
  try{ await FB.F.deleteDoc(FB.F.doc(FB.db,"users",UID,"items",id)); }catch(e){ console.warn(e); }
}
async function cloudPutTrip(t){
  if(!UID||!t) return;
  try{ await FB.F.setDoc(FB.F.doc(FB.db,"users",UID,"trips",t.id),t); }catch(e){ console.warn(e); }
}
async function cloudDelTrip(id){
  if(!UID||!id) return;
  try{ await FB.F.deleteDoc(FB.F.doc(FB.db,"users",UID,"trips",id)); }catch(e){ console.warn(e); }
}
async function cloudSettings(){
  if(!UID) return;
  try{ await FB.F.setDoc(FB.F.doc(FB.db,"users",UID,"sys","meta"),{set:S.set,updatedAt:Date.now()}); }catch(e){ console.warn(e); }
}
const isStandalone=()=>window.navigator.standalone===true||window.matchMedia("(display-mode: standalone)").matches;
async function cloudSignIn(){
  if(!FB){ toast("請先設定 Firebase（設定頁貼上，或填 HTML 最上方的 fb-config 區塊）"); return; }
  const {F,auth}=FB, prov=new F.GoogleAuthProvider();
  /* 主畫面 App 裡沒有彈出視窗可用，直接走轉址 */
  if(isStandalone()){
    toast("前往 Google 登入…");
    try{ await F.signInWithRedirect(auth,prov); }catch(e){ console.warn(e); toast("登入失敗："+(e.message||e)); }
    return;
  }
  try{
    await F.signInWithPopup(auth,prov);
  }catch(e){
    console.warn(e);
    const c=String(e.code||"");
    if(c.includes("popup")||c.includes("operation-not-supported")||c.includes("cancelled")){
      toast("改用轉址方式登入…");
      try{ await F.signInWithRedirect(auth,prov); }catch(e2){ toast("登入失敗："+(e2.message||e2)); }
    } else {
      toast("登入失敗："+(e.message||e));
    }
  }
}
async function cloudSignOut(){ if(FB) try{ await FB.F.signOut(FB.auth); }catch(e){} }

window.addEventListener("fb-ready",cloudInit);
window.addEventListener("fb-failed",()=>{ if(fbCfg()){ fbState="error"; paintCloud(); } });

<script type="module">
/* Firebase 12.19.0 官方 CDN。放在主程式之後，module 預設 defer，所以主程式已經註冊好監聽 */
const V="12.19.0", B="https://www.gstatic.com/firebasejs/"+V+"/";
try{
  const [A,Au,Fs]=await Promise.all([
    import(B+"firebase-app.js"),
    import(B+"firebase-auth.js"),

  ]);
  window.__FB={
    initializeApp:A.initializeApp,
    getAuth:Au.getAuth, GoogleAuthProvider:Au.GoogleAuthProvider,

    getRedirectResult:Au.getRedirectResult,
    signOut:Au.signOut, onAuthStateChanged:Au.onAuthStateChanged,
    initializeFirestore:Fs.initializeFirestore, persistentLocalCache:Fs.persistentLocalCache,
    persistentMultipleTabManager:Fs.persistentMultipleTabManager,
    doc:Fs.doc, setDoc:Fs.setDoc, deleteDoc:Fs.deleteDoc,
    collection:Fs.collection, onSnapshot:Fs.onSnapshot, getDocs:Fs.getDocs
  };
