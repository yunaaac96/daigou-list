<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日本代購購物清單</title>

<!-- 加入主畫面後的 App 外觀 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="theme-color" content="#C33A2E" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="代購清單">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="日本代購的購物清單、訂金流程與對帳工具">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F3EF; --card:#FFFFFF; --ink:#1A1C19; --ink2:#60655C; --ink3:#8D9289;
  --rule:#DCDED6; --rule2:#EAEBE5;
  --shu:#C33A2E;      /* 朱 — 支出・提醒 */
  --amber:#A8700F;    /* 琥珀 — 等訂金・待退 */
  --matcha:#3D6B4E;   /* 深綠 — 已購・利潤 */
  --gold:#8E6B1F;     /* 金 — 退稅 */
  --shadow:0 1px 0 rgba(26,28,25,.05), 0 2px 10px rgba(26,28,25,.05);
  --r:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#15171A; --card:#1E2126; --ink:#ECEEE8; --ink2:#A2A89C; --ink3:#767C70;
    --rule:#2E333A; --rule2:#272B31;
    --shu:#E4756A; --matcha:#79B98E; --gold:#D4A94F; --amber:#D9A445;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 2px 10px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --paper:#15171A; --card:#1E2126; --ink:#ECEEE8; --ink2:#A2A89C; --ink3:#767C70;
  --rule:#2E333A; --rule2:#272B31;
  --shu:#E4756A; --matcha:#79B98E; --gold:#D4A94F; --amber:#D9A445;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 2px 10px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
body{
  margin:0; height:100%; background:var(--paper); color:var(--ink);
  font-family:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.55; -webkit-text-size-adjust:100%;
}
.jp{font-family:"Noto Sans JP","Noto Sans TC",sans-serif}
.num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--shu); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

/* ---------- 版頭 ---------- */
.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  background:var(--paper); border-bottom:1px solid var(--rule);
  transition:box-shadow .18s;
}
/* 捲動後給一點陰影，讓人知道底下還有內容 */
.top.lifted{box-shadow:0 2px 10px color-mix(in srgb,var(--ink) 9%,transparent)}
/* 統計與篩選改成跟著捲走：黏頂的只剩檔期和分頁，手機才看得到清單 */
.stats{margin-top:0}
.wrap{max-width:1100px; margin:0 auto; padding:0 14px}
.brand{display:flex; align-items:center; gap:8px; padding:12px 0 8px; min-width:0}
.brand h1{margin:0; font-size:17px; font-weight:700; letter-spacing:.01em; white-space:nowrap; flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis}
.brand .sub{font-size:12px; color:var(--ink3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:0 1 auto; min-width:0}
.brand .spacer{flex:1 1 0; min-width:0}
.brand .iconbtn{flex:0 0 auto}   /* 按鈕永遠不被壓縮或推出畫面 */
@media (max-width:620px){
  .brand h1{font-size:15.5px}
  .brand .sub{display:none}      /* 匯率在設定頁與檔期列都看得到，這裡讓位給按鈕 */
  .brand .iconbtn{padding:5px 8px; font-size:12px}
}
@media (max-width:380px){
  .brand h1{font-size:14px}
}
.iconbtn{
  background:transparent; border:1px solid var(--rule); border-radius:9px;
  padding:5px 9px; font-size:12.5px; color:var(--ink2);
}
.iconbtn:hover{border-color:var(--ink3)}

.tripbar{display:flex; align-items:center; gap:7px; padding:0 0 9px}
.tripbar select{
  background:var(--card); border:1px solid var(--rule); border-radius:9px;
  padding:6px 9px; font-size:14px; font-weight:700; max-width:58vw;
}
.tripmeta{font-size:11.5px; color:var(--ink3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tabs{display:flex; gap:2px; padding-bottom:0}
.tag.trip{border-color:color-mix(in srgb,var(--gold) 60%,transparent); color:var(--gold)}
.tripcard{background:var(--card); border:1px solid var(--rule); border-radius:11px; padding:12px 13px; margin-bottom:9px}
.tripcard.arch{opacity:.6}
.tripcard .th{display:flex; align-items:center; gap:9px; flex-wrap:wrap}
.tripcard .th b{font-size:14.5px}
.tripcard .th .sp{flex:1}
.tripcard .meta{font-size:11.5px; color:var(--ink3); margin-top:3px}
.tripcard .sums{display:flex; gap:14px; flex-wrap:wrap; margin-top:8px; font-size:12px}
.tripcard .sums span b{font-variant-numeric:tabular-nums}
.tab{
  background:none; border:none; border-bottom:2px solid transparent;
  padding:7px 13px 9px; font-size:14px; font-weight:500; color:var(--ink3);
}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--shu)}
.tab .pill{
  display:inline-block; min-width:18px; margin-left:5px; padding:0 5px;
  background:var(--shu); color:#fff; border-radius:9px;
  font-size:11px; font-weight:700; line-height:17px; text-align:center;
}

/* ---------- 統計 ---------- */
/* 統計區：內容是「代購」「自購」兩個區塊，直向堆疊 */
.stats{display:block; padding:2px 14px 8px; border-bottom:1px solid var(--rule)}
.stat{min-width:0}
.stat .v{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.stat .k{font-size:11px; color:var(--ink3); white-space:nowrap}
.stat .v{font-size:16px; font-weight:700; line-height:1.3; letter-spacing:-.01em}
/* ---------- 篩選 ---------- */
.filters{display:flex; gap:7px; overflow-x:auto; padding:10px 0 11px; scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters input,.filters select{
  background:var(--card); border:1px solid var(--rule); border-radius:9px;
  padding:7px 9px; font-size:13px; flex:0 0 auto; max-width:46vw;
}
.filters input{flex:1 1 150px; min-width:130px}
.flow{display:flex; gap:6px; overflow-x:auto; padding:0 0 12px; scrollbar-width:none}
.flow::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto; background:var(--card); border:1px solid var(--rule);
  border-radius:999px; padding:5px 12px; font-size:12.5px; color:var(--ink2);
  display:flex; align-items:center; gap:6px;}
.fchip b{font-weight:700; font-variant-numeric:tabular-nums}
.fchip[data-on="1"]{border-width:1.5px}
.fchip.go{color:var(--matcha); border-color:color-mix(in srgb,var(--matcha) 55%,transparent)}
.fchip.wait{color:var(--amber); border-color:color-mix(in srgb,var(--amber) 55%,transparent)}
.fchip.mid{color:var(--shu); border-color:color-mix(in srgb,var(--shu) 45%,transparent)}
.fchip.alert{color:var(--shu); border-color:var(--shu); font-weight:500}
.chipclear{
  background:var(--shu); color:#fff; border:none; border-radius:9px;
  padding:7px 11px; font-size:13px; flex:0 0 auto;
}

/* ---------- 清單 ---------- */
main{padding:14px 0 100px}
.grid{display:grid; gap:11px; grid-template-columns:1fr}
@media (min-width:720px){.grid{grid-template-columns:1fr 1fr}}
@media (min-width:1060px){.grid{grid-template-columns:1fr 1fr 1fr}}

.item{
  background:var(--card); border:1px solid var(--rule); border-radius:var(--r);
  box-shadow:var(--shadow); display:flex; overflow:hidden;
}
.item.done{opacity:.62}
/* 左側數量標條：價格標籤的視覺來源 */
.qtybar{
  flex:0 0 46px; background:var(--rule2); border-right:1px dashed var(--rule);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  padding:8px 0;
}
.qtybar b{font-size:21px; font-weight:700; line-height:1}
.qtybar span{font-size:10px; color:var(--ink3)}
.item.self .qtybar{background:var(--rule2)}
.item.s-todo        .qtybar{background:color-mix(in srgb,var(--amber) 15%,var(--card))}
.item.ready         .qtybar{background:color-mix(in srgb,var(--matcha) 15%,var(--card))}
.item.s-bought      .qtybar{background:color-mix(in srgb,var(--matcha) 10%,var(--card))}
.item.s-unavailable .qtybar{background:var(--rule2)}
.item.s-todo:not(.ready){border-style:dashed}
.item.ready{border-color:color-mix(in srgb,var(--matcha) 45%,var(--rule)); border-width:1.5px}

/* ---- 統計：代購／自購分區 ---- */
.sgrp{border:1px solid var(--rule); border-radius:11px; background:var(--card); padding:9px 12px 10px; margin:8px 0}
.sgrp.oneline{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; padding:9px 12px; font-size:12.5px}
.sgrp.oneline>b{font-size:13px; letter-spacing:.08em}
.sgrp.oneline .n{font-size:11.5px; color:var(--ink3)}
.sgrp.oneline .sp{flex:1 1 0; min-width:0}
.sgrp.oneline .kv{font-size:11.5px; color:var(--ink3); white-space:nowrap}
.sgrp.oneline .kv b{font-size:14px; color:var(--ink2); margin-left:2px}
.sgrp.peek{cursor:pointer; border-left-color:var(--shu)}
.sgrp.peek:active{background:color-mix(in srgb,var(--shu) 5%,var(--card))}
.sgrp.oneline .kv.done{color:var(--matcha)}
.schev{border:0; background:transparent; color:var(--ink3); font-size:13px; line-height:1;
  padding:4px 2px 4px 8px; flex:0 0 auto}
.schev:hover{color:var(--ink)}
.sgh .sp{flex:1 1 0; min-width:0}
.sgrp.buy{border-left:3px solid var(--shu)}
.sgrp.self{border-left:3px solid var(--rule2); background:color-mix(in srgb,var(--card) 60%,var(--paper))}
.sgh{display:flex; align-items:baseline; gap:10px; margin-bottom:7px}
.sgh b{font-size:13px; letter-spacing:.08em}
.sgh span{font-size:11.5px; color:var(--ink3)}
.snote{font-size:10.5px; color:var(--ink3); margin-top:6px; line-height:1.55}
.srow{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:9px 10px}
.srow .stat{background:transparent; border:0; padding:0; min-width:0}
.srow .stat .k{font-size:11px; color:var(--ink3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.srow .stat .v{font-size:16px; font-weight:600; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.srow .stat.sub .v{font-size:14.5px; color:var(--ink2)}
/* 前四格是「還沒做完的事」，後三格是「這趟的結果」，用一條虛線分開 */
.srow>.stat:nth-child(5){border-top:1px dashed var(--rule); padding-top:8px}
.srow>.stat:nth-child(6){border-top:1px dashed var(--rule); padding-top:8px}
.srow>.stat:nth-child(7){border-top:1px dashed var(--rule); padding-top:8px}
@media(max-width:560px){
  /* 手機維持四欄兩列：七個數字兩行看完，不用一直往下捲 */
  .srow{gap:8px}
  .srow .stat .k{font-size:10px}
  .srow .stat .v{font-size:13.5px}
  .srow .stat.sub .v{font-size:13px}
  .srow>.stat:nth-child(-n+4){border-bottom:1px dashed var(--rule); padding-bottom:8px}
  .srow>.stat:nth-child(n+5){border-top:0; padding-top:1px}
}
@media(max-width:360px){
  .srow{gap:6px}
  .srow .stat .k{font-size:9.5px}
  .srow .stat .v{font-size:12.5px}
  .srow .stat.sub .v{font-size:12px}
}
@media (min-width:1024px){
  /* 桌機夠寬：七個數字排成一列，分隔線改成直的 */
  .sgrp{margin:8px 0}
  .srow{grid-template-columns:repeat(7,minmax(0,1fr)); gap:12px}
  .srow>.stat:nth-child(5){border-top:0; padding-top:0;
    border-left:1px dashed var(--rule); padding-left:12px}
  .srow>.stat:nth-child(6),.srow>.stat:nth-child(7){border-top:0; padding-top:0}
  .srow .stat.sub .v{font-size:15.5px}
}


/* ---- 對帳：客人訂單 ---- */
.ledger.ord.settled{opacity:.72}
.phase{font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid currentColor; white-space:nowrap}
.phase.wait{color:var(--amber)} .phase.go{color:var(--matcha)}
.phase.mid{color:var(--shu)} .phase.alert{color:var(--shu)} .phase.done{color:var(--ink3)}
.paybar{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; padding:11px 14px 12px; border-bottom:1px dashed var(--rule)}
.pay{border:1px solid var(--rule); border-radius:10px; padding:9px 10px; background:var(--paper); min-width:0}
.pay.on{border-color:color-mix(in srgb,var(--matcha) 50%,var(--rule)); background:color-mix(in srgb,var(--matcha) 7%,var(--paper))}
.pay.quiet{background:transparent}
.pay .k{font-size:11px; color:var(--ink3); display:flex; gap:6px; align-items:baseline}
.pay .k .mini{font-size:10px; opacity:.8}
.pay .v{font-size:17px; font-weight:600; margin-top:3px; font-variant-numeric:tabular-nums}
.pay .sub{font-size:10.5px; color:var(--ink3); margin-top:3px; line-height:1.6}
.nw{white-space:nowrap}
.pay > .act{margin-top:7px; width:100%; justify-content:center; display:flex}
.pedit .act{flex:0 0 auto; width:auto; padding:4px 8px; margin:0}
.pay .act[disabled]{opacity:.4; pointer-events:none}
.pedit{display:flex; gap:5px; align-items:center; margin-top:3px}
.pin{flex:1; min-width:0; width:100%; font-size:16px; font-weight:600; padding:3px 6px;
     border:1px solid var(--rule); border-radius:7px; background:var(--card); color:var(--ink);
     font-variant-numeric:tabular-nums}
.pin:focus{outline:none; border-color:var(--shu)}
@media(max-width:700px){ .paybar{grid-template-columns:repeat(2,minmax(0,1fr))} }
.salebox{margin:11px 14px 0; padding:11px 12px; background:var(--paper); border:1px solid var(--rule);
  border-radius:9px; font-size:12.5px; line-height:1.85; white-space:pre-wrap; word-break:break-word; font-family:inherit}

/* ---- 表單進階區 ---- */
.adv{margin-top:14px; border-top:1px solid var(--rule); padding-top:4px}
.adv>summary{cursor:pointer; list-style:none; padding:9px 2px; font-size:12.5px; color:var(--ink2);
  display:flex; align-items:center; gap:8px; user-select:none}
.adv>summary::-webkit-details-marker{display:none}
.adv>summary::before{content:"▸"; font-size:11px; color:var(--ink3); transition:transform .15s}
.adv[open]>summary::before{transform:rotate(90deg)}
.adv>summary:hover{color:var(--ink)}
.advhint{font-size:11px; color:var(--ink3); font-weight:400}
.adv .fgrid{margin-top:4px}

/* ---- 收益核帳 ---- */
.audit{margin-top:18px; border-top:2px solid var(--rule2)}
.auditsum{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; padding:11px 14px 4px}
.auditsum .k{font-size:11px; color:var(--ink3)}
.auditsum .v{font-size:18px; font-weight:600; margin-top:2px; font-variant-numeric:tabular-nums}
.audithint{margin:10px 14px 14px; padding-left:18px; font-size:11.5px; color:var(--ink3); line-height:1.9}
.audithint b{color:var(--shu)}
.audittbl{overflow-x:auto; margin-top:12px; -webkit-overflow-scrolling:touch}
.audit, .copanel{padding-bottom:2px}
table.at{min-width:900px}
table.at tfoot td{border-top:2px solid var(--rule2); font-weight:600; padding-top:9px}
table.at tr.skip td{opacity:.5}
.sub2{font-size:10.5px; color:var(--ink3); line-height:1.5; font-weight:400}
.srctag{font-size:10px; padding:1px 6px; border-radius:999px; border:1px solid var(--rule2); white-space:nowrap}
.srctag.card,.srctag.checkout{border-color:var(--matcha); color:var(--matcha)}
.srctag.est{border-color:var(--amber); color:var(--amber)}

/* ---- 結帳單 ---- */
.copanel{margin-top:18px; border-top:2px solid var(--rule2)}
.corow{display:flex; gap:11px; align-items:center; padding:10px 14px; border-bottom:1px dashed var(--rule)}
.corow:last-child{border-bottom:0}
.comain{flex:1; min-width:0}
.con{font-size:13.5px; font-weight:600}
.cosub{display:block; font-size:11px; color:var(--ink3); margin-top:2px; line-height:1.6}
.comoney{text-align:right; white-space:nowrap}
.comoney b{font-size:15px; font-variant-numeric:tabular-nums}
.pickbox{max-height:300px; overflow:auto; border:1px solid var(--rule); border-radius:10px; background:var(--paper)}
.pickrow{display:flex; gap:9px; align-items:center; padding:8px 11px; border-bottom:1px dashed var(--rule);
  font-size:12.5px; cursor:pointer}
.pickrow:last-child{border-bottom:0}
.pickrow.on{background:color-mix(in srgb,var(--matcha) 9%,var(--paper))}
.pickrow .pn{flex:1; min-width:0}
.pickrow .pn i{display:block; font-style:normal; font-size:11px; color:var(--ink3)}
.pickrow .pw{font-size:11px; color:var(--ink3); white-space:nowrap}
.pickrow .pq{font-size:12px; color:var(--ink2); white-space:nowrap}
.pickrow .pp{font-size:12px; white-space:nowrap; font-variant-numeric:tabular-nums; min-width:62px; text-align:right}
@media(max-width:520px){ .pickrow .pw{display:none} }

.body{flex:1; min-width:0; padding:11px 12px 10px}
.head{display:flex; gap:10px; padding-right:72px}  /* 右上角狀態標籤的位置，避免壓到品名 */
.thumb{
  flex:0 0 54px; height:54px; border-radius:9px; background:var(--rule2);
  border:1px solid var(--rule); object-fit:cover; display:block;
}
.noimg{
  flex:0 0 54px; height:54px; border-radius:9px; background:var(--rule2);
  border:1px dashed var(--rule); display:grid; place-items:center;
  font-size:10px; color:var(--ink3);
}
.names{min-width:0; flex:1}
.nm{font-size:15px; font-weight:700; line-height:1.3; word-break:break-word}
.nj{font-size:12.5px; color:var(--ink2); line-height:1.35; word-break:break-word}
.spec{font-size:11.5px; color:var(--ink3); margin-top:2px}

.meta{display:flex; flex-wrap:wrap; gap:5px; margin:8px 0 2px}
.tag{
  font-size:11px; padding:2px 7px; border-radius:6px;
  border:1px solid var(--rule); color:var(--ink2); background:transparent;
}
.tag.store{border-color:color-mix(in srgb,var(--ink3) 45%,transparent)}
.tag.cust{border-color:color-mix(in srgb,var(--matcha) 55%,transparent); color:var(--matcha)}
.tag.buy{background:var(--shu); border-color:var(--shu); color:#fff; font-weight:500}
.tag.self{background:var(--ink3); border-color:var(--ink3); color:var(--card); font-weight:500}

/* 金額區：收據式點線引導 */
.money{margin-top:9px; border-top:1px solid var(--rule2); padding-top:8px}
.row{display:flex; align-items:baseline; gap:6px; font-size:12.5px; line-height:1.9; min-width:0}
.row .lab{color:var(--ink3); white-space:nowrap; min-width:0; overflow:hidden; text-overflow:ellipsis}
.row .dots{flex:1 1 12px; min-width:8px; border-bottom:1px dotted var(--rule); transform:translateY(-3px)}
.row .val{font-weight:500; white-space:nowrap; flex:0 0 auto}
.row.tax .val{color:var(--gold)}
.row.total{font-size:14px; border-top:1px solid var(--rule2); margin-top:5px; padding-top:5px}
.row.total .lab{color:var(--ink2); font-weight:500}
.row.total .val{font-weight:700; color:var(--matcha)}
.row.dep .val{color:var(--amber)}
.row.paid .val{color:var(--ink); font-weight:700}
.row.actual .lab{color:var(--matcha)}
.row.actual .val{color:var(--matcha); font-weight:700}
.rate{margin-top:7px; font-size:11px; color:var(--ink3); font-variant-numeric:tabular-nums;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.rate.diff{color:var(--amber)}
.row.bal .val{color:var(--shu)}
.row.total.loss .val{color:var(--shu)}

.acts{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.act{
  background:transparent; border:1px solid var(--rule); border-radius:8px;
  padding:5px 10px; font-size:12.5px; color:var(--ink2);
}
.act:hover{border-color:var(--ink3); color:var(--ink)}
.act.go{border-color:color-mix(in srgb,var(--matcha) 50%,transparent); color:var(--matcha)}
.act.state{border-color:color-mix(in srgb,var(--matcha) 55%,transparent); color:var(--matcha); font-weight:500}
.act.warn{border-color:color-mix(in srgb,var(--amber) 55%,transparent); color:var(--amber)}
.act.del:hover{border-color:var(--shu); color:var(--shu)}

/* 狀態印章 */
.stamp{
  position:absolute; right:10px; top:9px; z-index:1;
  font-size:10.5px; font-weight:700; line-height:1.5;
  padding:2px 7px; border-radius:5px; letter-spacing:.02em; white-space:nowrap;
}
.item{position:relative}
.stamp.go{background:var(--matcha); color:var(--card)}
.stamp.wait{border:1.5px solid var(--amber); color:var(--amber)}
.stamp.mid{border:1.5px solid var(--shu); color:var(--shu)}
.stamp.done{border:1.5px solid var(--ink3); color:var(--ink3)}
.stamp.alert{background:var(--shu); color:#fff}

/* ---------- 空狀態 ---------- */
.empty{
  border:1px dashed var(--rule); border-radius:var(--r); padding:34px 20px;
  text-align:center; color:var(--ink2); background:var(--card);
}
.empty h3{margin:0 0 6px; font-size:16px; color:var(--ink)}
.empty p{margin:0 0 14px; font-size:13.5px}
.linkbtn{background:none; border:none; color:var(--shu); text-decoration:underline; font-size:13.5px; padding:0}

/* ---------- 對帳 ---------- */
.ledger{background:var(--card); border:1px solid var(--rule); border-radius:var(--r); margin-bottom:12px; overflow:hidden}
.lhead{display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--rule2); flex-wrap:wrap}
.lhead h3{margin:0; font-size:15.5px; font-weight:700; min-width:0; overflow-wrap:anywhere}
.lhead .cnt{font-size:12px; color:var(--ink3)}
.lhead .spacer{flex:1}
/* .ledger 本身沒有內距，裡面直接放的說明文字要自己補，否則會貼著邊框 */
.ledger>.hint{margin:0; padding:12px 14px 14px; line-height:1.85}
.lsum{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1px; background:var(--rule2)}
.lsum div{background:var(--card); padding:9px 14px}
.lsum .k{font-size:11px; color:var(--ink3)}
.lsum .v{font-size:15px; font-weight:700}
.lsum .v.net{color:var(--matcha)}
.lflow{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:1px; background:var(--rule2); border-top:1px solid var(--rule2)}
.lflow div{background:var(--card); padding:8px 14px}
.lflow .k{font-size:11px; color:var(--ink3)}
.lflow .v{font-size:13.5px; font-weight:700}
.lflow .v.wait{color:var(--amber)} .lflow .v.go{color:var(--matcha)} .lflow .v.mid{color:var(--shu)}
@media (max-width:620px){.lflow{grid-template-columns:repeat(2,1fr)}}
.lttbl{overflow-x:auto; -webkit-overflow-scrolling:touch}
table.lt{width:100%; border-collapse:collapse; font-size:12.5px}
table.lt th,table.lt td{padding:7px 14px; text-align:left; border-top:1px solid var(--rule2)}
@media(max-width:420px){
  /* 窄機身：縮內距、縮字，先讓表格塞得下；真的塞不下才左右捲 */
  table.lt{font-size:11.5px}
  table.lt th,table.lt td{padding:7px 8px}
  table.lt th:first-child,table.lt td:first-child{padding-left:14px}
  table.lt th:last-child,table.lt td:last-child{padding-right:14px}
  .paybar{padding-left:10px; padding-right:10px; gap:8px}
  .pay{padding:8px}
  .auditsum{padding-left:10px; padding-right:10px; gap:6px}
  .auditsum .v{font-size:14.5px}
  .auditsum .k{font-size:10.5px}
  .salebox{margin-left:10px; margin-right:10px}
  .corow{padding-left:10px; padding-right:10px}
  .lhead{padding:11px 10px; gap:8px}
  .brow{padding-left:10px; padding-right:10px}
  .ledger>.hint{padding-left:10px; padding-right:10px}
}
table.lt th{font-size:11px; color:var(--ink3); font-weight:500}
table.lt td.n{text-align:right; white-space:nowrap}



.buybar{display:flex; align-items:center; gap:10px; padding:4px 2px 12px; font-size:13px; color:var(--ink2)}
.buybar .sp{flex:1}
.buybar b{color:var(--ink); font-size:15px}
.chk{display:flex; align-items:center; gap:6px; cursor:pointer}
.brow{display:flex; gap:11px; padding:11px 14px; border-top:1px solid var(--rule2); align-items:flex-start}
.brow .bq{flex:0 0 46px; font-size:17px; font-weight:700; color:var(--shu); text-align:right; padding-top:1px}
.brow .bmain{flex:1; min-width:0}
.brow .bn{font-size:14px; font-weight:700; line-height:1.35; word-break:break-word}
.brow .bs{font-size:11.5px; color:var(--ink3); margin-top:1px}
.brow .bw{display:flex; flex-wrap:wrap; gap:4px; margin-top:6px}
.brow .bact{display:flex; flex-direction:column; gap:5px; flex:0 0 auto}
@media (max-width:620px){
  .brow{flex-wrap:wrap}
  .brow .bact{flex-direction:row; width:100%; padding-left:57px}
}

/* ---------- 設定頁樣式 ---------- */
.panel{background:var(--card); border:1px solid var(--rule); border-radius:var(--r); padding:16px; margin-bottom:12px}
.panel h3{margin:0 0 3px; font-size:15.5px}
.panel .hint{margin:0 0 14px; font-size:12.5px; color:var(--ink3)}
.fgrid{display:grid; gap:12px; grid-template-columns:1fr}
@media (min-width:600px){.fgrid{grid-template-columns:1fr 1fr}}
label.f{display:block}
label.f .lb,.lb{display:block; font-size:12.5px; color:var(--ink2); margin-bottom:4px}
label.f .lb em{font-style:normal; color:var(--ink3); font-size:11.5px}
input.i,select.i,textarea.i{
  width:100%; background:var(--paper); border:1px solid var(--rule);
  border-radius:9px; padding:9px 10px; font-size:14px;
}
textarea.i{resize:vertical; min-height:58px}
/* 設定頁的說明列：桌機左右對齊，手機改上下排，長句才不會撐破 */
.panel .row{align-items:flex-start}
.panel .row .val{white-space:normal; text-align:right; max-width:62%}
@media (max-width:620px){
  .panel .row{flex-direction:column; gap:0; line-height:1.55; margin-bottom:9px}
  .panel .row .dots{display:none}
  .panel .row .lab{white-space:normal}
  .panel .row .val{white-space:normal; text-align:left; max-width:100%; font-weight:600}
  .panel .row.total{border-top:1px solid var(--rule2); padding-top:7px}
}
.btnrow{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
.btn{border:1px solid var(--rule); background:var(--card); border-radius:10px; padding:9px 14px; font-size:13.5px}
.btn.primary{background:var(--shu); border-color:var(--shu); color:#fff; font-weight:500}
.btn.danger{color:var(--shu); border-color:color-mix(in srgb,var(--shu) 50%,transparent)}

/* ---------- 新增鈕 ---------- */
.fab{
  position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:40;
  background:var(--shu); color:#fff; border:none; border-radius:999px;
  padding:14px 20px; font-size:15px; font-weight:700;
  box-shadow:0 4px 16px rgba(195,58,46,.35);
}

/* ---------- 表單 ---------- */
.sheet{position:fixed; inset:0; z-index:60; display:none}
.sheet[open]{display:block}
.veil{position:absolute; inset:0; background:rgba(16,18,15,.5)}
.panelbox{
  position:absolute; left:0; right:0; bottom:0; max-height:92%;
  background:var(--paper); border-radius:18px 18px 0 0; overflow:auto;
  padding:16px 14px calc(22px + env(safe-area-inset-bottom,0px));
}
@media (min-width:720px){
  .panelbox{
    left:50%; transform:translateX(-50%); bottom:auto; top:4%;
    width:660px; max-height:90%; border-radius:16px;
  }
}
.sheet h2{margin:0 0 14px; font-size:17px}
.imgpick{display:flex; align-items:center; gap:12px; margin-bottom:14px}
.imgpick img{width:66px; height:66px; border-radius:11px; object-fit:cover; border:1px solid var(--rule)}
.imgpick .ph{width:66px; height:66px; border-radius:11px; border:1px dashed var(--rule); display:grid; place-items:center; font-size:11px; color:var(--ink3)}

.calc{background:var(--card); border:1px solid var(--rule); border-radius:11px; padding:11px 12px; margin-top:12px}
.calc .row{font-size:13px}

/* ---------- 提示 ---------- */
.toast{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(86px + env(safe-area-inset-bottom,0px)); z-index:80;
  background:var(--ink); color:var(--paper); padding:9px 16px; border-radius:999px;
  font-size:13.5px; opacity:0; pointer-events:none; transition:opacity .18s;
}
.toast.show{opacity:1}
#banner{border-radius:var(--r); padding:13px 15px; margin:12px 0 0; border:1px solid}
#banner.warn{background:color-mix(in srgb,var(--amber) 12%,var(--card)); border-color:var(--amber)}
#banner.bad{background:color-mix(in srgb,var(--shu) 12%,var(--card)); border-color:var(--shu)}
#banner h4{margin:0 0 4px; font-size:14.5px}
#banner.warn h4{color:var(--amber)} #banner.bad h4{color:var(--shu)}
#banner p{margin:0 0 10px; font-size:12.5px; color:var(--ink2); line-height:1.6}
#banner .btnrow{margin-top:0}
#bkBtn.ok{color:var(--matcha); border-color:color-mix(in srgb,var(--matcha) 45%,transparent)}
#bkBtn.warn{color:var(--amber); border-color:color-mix(in srgb,var(--amber) 55%,transparent)}
#bkBtn.bad{color:var(--shu); border-color:var(--shu)}
#cloudBtn.ok{color:var(--matcha); border-color:color-mix(in srgb,var(--matcha) 45%,transparent)}
#cloudBtn.warn{color:var(--amber); border-color:color-mix(in srgb,var(--amber) 55%,transparent)}
#cloudBtn.bad{color:var(--shu); border-color:var(--shu)}
.hide{display:none!important}
</style>
</head>
<body>

<div class="top">
  <div class="wrap">
    <div class="brand">
      <h1>日本代購購物清單</h1>
      <span class="sub num" id="rateNote"></span>
      <span class="spacer"></span>
      <button class="iconbtn" id="cloudBtn" title="同步狀態">本機</button>
      <button class="iconbtn" id="bkBtn" title="備份狀態">備份</button>
      <button class="iconbtn" id="themeBtn" title="切換深淺色">◐</button>
    </div>
    <div class="tripbar">
      <select id="tripSel" title="切換檔期"></select>
      <button class="iconbtn" id="tripNew" title="新增檔期">＋</button>
      <span class="tripmeta num" id="tripMeta"></span>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-view="list">清單<span class="pill hide" id="todoPill">0</span></button>
      <button class="tab" role="tab" aria-selected="false" data-view="buy">採購</button>
      <button class="tab" role="tab" aria-selected="false" data-view="ledger">對帳</button>
      <button class="tab" role="tab" aria-selected="false" data-view="settings">設定</button>
    </div>
  </div>
</div>

<div class="wrap" style="padding:0"><div class="stats" id="stats"></div></div>
<div class="wrap" id="filterWrap">
    <div class="filters">
      <input id="q" type="search" placeholder="搜尋商品、日文名、備註">
      <select id="fCust"><option value="">全部客人</option></select>
      <select id="fStore"><option value="">全部店家</option></select>
      <select id="fCat"><option value="">全部類別</option></select>
      <select id="fState"><option value="">全部狀態</option>
        <option value="ready">可以買</option><option value="todo">等訂金</option>
        <option value="bought">已買到</option><option value="unavailable">買不到</option></select>
      <select id="fKind"><option value="">代購＋自購</option><option value="buy">代購</option><option value="self">自購</option></select>
      <button class="chipclear hide" id="clearF">清除</button>
    </div>
    <div class="flow" id="flowChips"></div>
</div>

<!-- ===================================================================
     【要用雲端同步才需要填這裡；不填就是純本機版，功能完全一樣】

     把 Firebase 給你的那段 firebaseConfig 貼到下面兩行中間。
     連 const firebaseConfig = 和分號一起貼也沒關係，程式會自己挑出需要的欄位。
     這裡是純文字區塊，就算貼錯格式也不會讓頁面壞掉。
     =================================================================== -->
<script type="text/plain" id="fb-config">
</script>

<div class="wrap"><div id="banner" class="hide"></div></div>

<main class="wrap">
  <div id="viewList"><div class="grid" id="grid"></div></div>
  <div id="viewBuy" class="hide"></div>
  <div id="viewLedger" class="hide"></div>
  <div id="viewSettings" class="hide"></div>
</main>

<button class="fab" id="addBtn">＋ 新增</button>

<div class="sheet" id="sheet" aria-modal="true" role="dialog">
  <div class="veil" data-close></div>
  <div class="panelbox">
    <h2 id="sheetTitle">新增商品</h2>
    <form id="form">
      <div class="imgpick">
        <div id="imgSlot" class="ph">無圖</div>
        <div>
          <input type="file" id="img" accept="image/*" style="font-size:12.5px; max-width:200px">
          <div style="font-size:11.5px; color:var(--ink3); margin-top:4px">可直接拍照，會自動壓成縮圖存在本機</div>
          <button type="button" class="btn" id="imgClear" style="margin-top:6px; padding:4px 10px; font-size:12px">移除圖片</button>
        </div>
      </div>

      <div class="fgrid">
        <label class="f"><span class="lb">商品名稱（中文）</span><input class="i" name="nameZh" required placeholder="例：樂敦肌研極潤化妝水"></label>
        <label class="f"><span class="lb">商品名稱（日文）<em>　用於地圖搜尋</em></span><input class="i jp" name="nameJa" placeholder="例：肌ラボ 極潤 化粧水"></label>
        <label class="f"><span class="lb">規格／尺寸</span><input class="i" name="spec" placeholder="例：170mL／M 號／156 枚"></label>
        <label class="f"><span class="lb">商品連結<em>　官網商品頁網址</em></span><input class="i" name="url" type="url" placeholder="https://..."></label>
        <label class="f"><span class="lb">數量</span><input class="i num" name="qty" type="number" min="1" step="1" value="1" required></label>
        <label class="f"><span class="lb">類型</span>
          <select class="i" name="kind"><option value="buy">代購</option><option value="self">自購</option></select>
        </label>
        <label class="f"><span class="lb">客人<em>　代購時填</em></span><input class="i" name="customer" list="dlCust" placeholder="例：小美"><datalist id="dlCust"></datalist></label>
        <label class="f"><span class="lb">店家</span><input class="i" name="store" list="dlStore" placeholder="例：マツモトキヨシ"><datalist id="dlStore"></datalist></label>
        <label class="f"><span class="lb">類別</span><input class="i" name="category" list="dlCat" placeholder="例：藥妝"><datalist id="dlCat"></datalist></label>
        <label class="f"><span class="lb">當地單價 ¥<em>　含稅標價</em></span><input class="i num" name="price" type="number" min="0" step="1" required placeholder="1280"></label>
        <label class="f"><span class="lb">代購匯率（本筆）<em>　跟客人報價用</em></span>
          <span style="display:flex; gap:6px">
            <input class="i num" name="rateSell" type="number" step="0.0001" style="flex:1">
            <button type="button" class="btn" id="useNow" style="flex:0 0 auto; padding:9px 11px; font-size:12.5px; white-space:nowrap">帶入今日</button>
          </span>
        </label>
      </div>

      <details class="adv" id="advBox">
        <summary>進階<span class="advhint" id="advHint"></span></summary>
        <div class="fgrid">
          <label class="f"><span class="lb">狀態</span>
            <select class="i" name="state">
              <option value="todo">待買</option>
              <option value="bought">已買到</option>
              <option value="unavailable">買不到</option>
            </select>
          </label>
          <label class="f"><span class="lb">檔期</span><select class="i" name="tripId"></select></label>
          <label class="f"><span class="lb">下單日期</span><input class="i" name="orderDate" type="date"></label>
          <label class="f"><span class="lb">實付 ¥<em>　單品收據；整張發票請用「結帳」</em></span><input class="i num" name="paidYen" type="number" min="0" step="1" placeholder="未結帳"></label>
          <label class="f"><span class="lb">刷卡帳單 NT$<em>　單品；整張卡單請用「結帳」</em></span><input class="i num" name="cardTwd" type="number" min="0" step="1" placeholder="未入帳"></label>
          <label class="f"><span class="lb">退稅金額 ¥<em>　留白＝依檔期的退稅方式</em></span><input class="i num" name="taxOv" type="number" min="0" step="1" placeholder="自動"></label>
          <label class="f"><span class="lb">代購實收 NT$<em>　留白＝依代購匯率</em></span><input class="i num" name="chargeOv" type="number" min="0" step="1" placeholder="自動"></label>
        </div>
        <label class="f" style="margin-top:12px"><span class="lb">備註</span><textarea class="i" name="note" placeholder="貨架位置、限購數量、客人指定色號…"></textarea></label>
      </details>

      <div class="calc" id="calcBox"></div>

      <div class="btnrow">
        <button type="submit" class="btn primary">儲存</button>
        <button type="button" class="btn" data-close>取消</button>
        <span style="flex:1"></span>
        <button type="button" class="btn danger hide" id="delBtn">刪除這筆</button>
      </div>
    </form>
  </div>
</div>

<div class="sheet" id="tripSheet" aria-modal="true" role="dialog">
  <div class="veil" data-close></div>
  <div class="panelbox">
    <h2 id="tripTitle">新增檔期</h2>
    <form id="tripForm">
      <p class="hint" style="margin:0 0 12px">一趟代購就是一個檔期。<b>退稅方式</b>和匯率設在這裡，不會影響其他檔期 —— 2026/11 起日本改成出境時還付，新舊檔期的算法會不一樣。</p>
      <div class="fgrid">
        <label class="f"><span class="lb">檔期名稱</span><input class="i" name="name" required placeholder="例：2026/11 東京"></label>
        <label class="f"><span class="lb">退稅方式<em>　這趟怎麼退稅</em></span>
          <select class="i" name="refundMode">
            <option value="store">店頭免稅（結帳直接付稅拔價）</option>
            <option value="airport">機場退稅（結帳付含稅，出境才退）</option>
          </select>
        </label>
        <label class="f"><span class="lb">出發日<em>　可留空</em></span><input class="i" name="start" type="date"></label>
        <label class="f"><span class="lb">回國日<em>　可留空</em></span><input class="i" name="end" type="date"></label>
        <label class="f"><span class="lb">代購匯率<em>　留空＝用今日設定</em></span><input class="i num" name="rateSell" type="number" step="0.0001" placeholder="跟著設定"></label>
        <label class="f"><span class="lb">實際匯率<em>　你換日幣的成本</em></span><input class="i num" name="rateReal" type="number" step="0.0001" placeholder="跟著設定"></label>
      </div>
      <label class="f" style="margin-top:12px"><span class="lb">備註</span><input class="i" name="note" placeholder="例：石垣島＋沖繩本島"></label>
      <div class="btnrow">
        <button type="submit" class="btn primary">儲存</button>
        <button type="button" class="btn" data-close>取消</button>
      </div>
    </form>
  </div>
</div>

<div class="sheet" id="coSheet" aria-modal="true" role="dialog">
  <div class="veil" data-close></div>
  <div class="panelbox">
    <h2 id="coTitle">新增結帳單</h2>
    <form id="coForm">
      <p class="hint" style="margin:0 0 12px">一張發票就是一張結帳單。勾選這張發票買了哪些商品，填上收據上的實付日幣；卡單出來之後再回來補刷卡台幣和手續費。系統會依各商品的標價比例把金額分攤回去。</p>
      <div class="fgrid">
        <label class="f"><span class="lb">店家</span><select class="i" name="store"></select></label>
        <label class="f"><span class="lb">單據名稱<em>　分辨同一家的多張發票</em></span><input class="i" name="label" placeholder="例：發票1／一樓結帳"></label>
        <label class="f"><span class="lb">結帳日期</span><input class="i" name="date" type="date"></label>
        <label class="f"><span class="lb">實付日幣 ¥<em>　收據上的總金額</em></span><input class="i num" name="yen" type="number" min="0" step="1" placeholder="例：24800"></label>
        <label class="f"><span class="lb">刷卡台幣 NT$<em>　卡單出來再填</em></span><input class="i num" name="twd" type="number" min="0" step="1" placeholder="未入帳"></label>
        <label class="f"><span class="lb">刷卡手續費 NT$<em>　海外交易手續費</em></span><input class="i num" name="feeTwd" type="number" min="0" step="1" placeholder="未入帳"></label>
      </div>
      <div class="lb" style="margin:16px 0 6px"><b>這張發票買了哪些</b><em>　買不到的、已經被別張結帳單用掉的不會出現</em></div>
      <div id="coPick" class="pickbox"></div>
      <label class="f" style="margin-top:12px"><span class="lb">備註</span><textarea class="i" name="note" placeholder="例：用信用卡 A 刷，店頭免稅"></textarea></label>
      <div class="calc" id="coCalc"></div>
      <div class="btnrow">
        <button type="submit" class="btn primary">儲存結帳單</button>
        <button type="button" class="btn" data-close>取消</button>
        <span style="flex:1"></span>
        <button type="button" class="btn danger hide" id="coDel">刪除</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
const KEY="daigou.jp.v1";
const BUILD="2026-10-22e";   /* 改版日期，設定頁最下面看得到，用來確認手機拿到的是不是新版 */
const DEF_SET={rateReal:0.215, rateSell:0.23, taxRate:10, base:"incl", depositPct:50,
               cardFeePct:1.5, refundMode:"store", theme:""};
/* 商品只管「買到沒有」。錢的事（訂金、尾款）移到客人訂單那一層，
   因為客人是整包下訂、整包付款，不是一件一件結。 */
const ST={
  todo:        {t:"待買",   chip:"待買",   tone:"wait",  btn:"買到了"},
  bought:      {t:"已買到", chip:"已買到", tone:"go",    btn:"退回待買"},
  unavailable: {t:"買不到", chip:"買不到", tone:"alert", btn:"改回待買"}
};
const FLOW_ORDER=["todo","bought","unavailable"];
let S={items:[], trips:[], orders:[], checkouts:[], cur:"", set:{...DEF_SET}, meta:{backupAt:0, backupCount:0}};
let editId=null, pendingImg=null;

/* ---------- 儲存 ---------- */
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){
      const d=JSON.parse(raw);
      S.items=Array.isArray(d.items)?d.items:[];
      S.set={...DEF_SET,...(d.set||{})};
      S.meta={backupAt:0, backupCount:0, ...(d.meta||{})};
      S.trips=Array.isArray(d.trips)?d.trips:[];
      S.orders=Array.isArray(d.orders)?d.orders:[];
      S.checkouts=Array.isArray(d.checkouts)?d.checkouts:[];
      S.cur=d.cur||"";
      S.items.forEach(it=>{
        if(it.depOv===undefined) it.depOv=null;
        if(it.paidYen===undefined) it.paidYen=null;
        if(it.cardTwd===undefined) it.cardTwd=null;
        if(it.url===undefined) it.url="";
        if(it.rateSell===undefined) it.rateSell=S.set.rateSell;   /* 既有資料凍結在目前匯率 */
        if(it.rateReal===undefined) it.rateReal=null;   /* 留空＝跟著檔期走 */
        if(it.orderDate===undefined) it.orderDate=new Date(it.ts||Date.now()).toISOString().slice(0,10);
      });
      migrateOrders();
      pruneOrders();
    }
  }catch(e){ console.warn("讀取失敗",e); }
}

/* ===== 舊版（錢綁在單品上）→ 新版（錢綁在客人訂單上）的一次性轉換 =====
   舊狀態：deposit_wait / deposit_paid / bought / settled / unavailable / refunded / todo
   新狀態：todo / bought / unavailable，訂金尾款改記在 S.orders。 */
const OLD_STATES=["deposit_wait","deposit_paid","settled","refunded"];
function migrateOrders(){
  const needs=S.items.some(it=>OLD_STATES.includes(it.state)) || S.items.some(it=>it.rateLocked!==undefined);
  if(!needs) return;
  /* 先把客人訂單整理出來，再把商品狀態降級 */
  const buckets={};
  S.items.forEach(it=>{
    if(it.kind!=="buy") return;
    const k=(it.tripId||"")+"\u0001"+(it.customer||"");
    (buckets[k]=buckets[k]||[]).push(it);
  });
  Object.keys(buckets).forEach(k=>{
    const arr=buckets[k], it0=arr[0];
    if(findOrder(it0.tripId,it0.customer||"")) return;      /* 已經轉過就不重複 */
    let depAmt=0, anyDep=false, allSettled=true, liveN=0, anyRefunded=false;
    arr.forEach(it=>{
      const took=it.depTaken||["deposit_paid","bought","settled","unavailable"].includes(it.state);
      if(took){ anyDep=true; depAmt += oldDeposit(it); }
      if(it.state==="refunded") { anyRefunded=true; return; }
      liveN++;
      if(it.state!=="settled") allSettled=false;
    });
    const o={
      id:newId("o"), tripId:it0.tripId||"", customer:it0.customer||"",
      depAmt: anyDep?Math.round(depAmt):null, depPaid:anyDep, depPaidAt: anyDep?(it0.orderDate||""):"",
      balPaid: !!(liveN && allSettled), balPaidAt:"", balAmt:null,
      refunded: anyRefunded && !anyDep, note:""
    };
    S.orders.push(o);
  });
  /* 商品狀態降級 */
  S.items.forEach(it=>{
    if(["deposit_wait","deposit_paid"].includes(it.state)) it.state="todo";
    else if(["settled"].includes(it.state)) it.state="bought";
    else if(["refunded"].includes(it.state)) it.state="unavailable";
    delete it.rateLocked; delete it.depTaken;
  });
  persist();
}
/* 舊版單品訂金的算法，只在轉換時用一次 */
function oldDeposit(it){
  const qty=Math.max(1,+it.qty||1), sub=(+it.price||0)*qty;
  const r=(+S.set.taxRate||0)/100;
  const tax=(it.taxOv===""||it.taxOv==null)?(r>0?sub/(1+r)*r:0):+it.taxOv;
  const base=S.set.base==="excl"?(sub-tax):sub;
  const rs=(it.rateSell!=null&&it.rateSell!=="")?+it.rateSell:(+S.set.rateSell||0);
  const charge=(it.chargeOv===""||it.chargeOv==null)?base*rs:+it.chargeOv;
  return (it.depOv===""||it.depOv==null) ? charge*((+S.set.depositPct||0)/100) : +it.depOv;
}
/* 只寫入本機，不更動備份提醒狀態（雲端同步下來時用） */
function persist(){
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }
  catch(e){ toast("儲存空間已滿，請先刪除幾張商品圖或匯出備份"); }
}
function save(){
  persist();
  paintBackup();
}

/* ========= 備份提醒 =========
   資料只存在這台裝置，所以「多久沒備份」是唯一要盯的風險指標 */
const DAY=86400000;
function bkAgeDays(){ return S.meta.backupAt ? Math.floor((Date.now()-S.meta.backupAt)/DAY) : null; }
function bkDrift(){ return S.items.length - (S.meta.backupCount||0); }
function paintBackup(){
  const b=document.getElementById("bkBtn"); if(!b) return;
  const d=bkAgeDays();
  let cls="", txt;
  if(!S.items.length){ txt="備份"; }
  else if(d===null){ txt="未備份"; cls="bad"; }
  else if(d>=7){ txt=`備份 ${d} 天前`; cls="bad"; }
  else if(d>=3){ txt=`備份 ${d} 天前`; cls="warn"; }
  else { txt= d===0?"今天已備份":`備份 ${d} 天前`; cls="ok"; }
  b.textContent=txt; b.className="iconbtn"+(cls?" "+cls:"");
  b.title="點一下立即匯出備份";
  paintBanner();
}
function paintBanner(){
  const el=document.getElementById("banner"); if(!el) return;
  const signedIn=!!(FB&&FB.auth&&FB.auth.currentUser);
  if(fbState==="ready" && !signedIn){   /* 已設定 Firebase 但還沒登入 */
    el.className="warn";
    el.innerHTML=`<h4>還沒登入，目前只存在這台裝置</h4>
      <p>登入後手機和電腦會自動同步。兩台請登入同一個 Google 帳號。</p>
      <div class="btnrow"><button class="btn primary" id="bnIn">用 Google 登入</button>
      <button class="btn" id="bnSkip">先不要</button></div>`;
    document.getElementById("bnIn").onclick=cloudSignIn;
    document.getElementById("bnSkip").onclick=()=>{ el.className="hide"; el.innerHTML=""; };
    return;
  }
  const d=bkAgeDays(), drift=bkDrift();
  let lvl=null, msg="";
  if(S.items.length && d===null){
    lvl="bad"; msg=`目前有 ${S.items.length} 筆資料從來沒有備份過。資料只存在這台裝置，清除瀏覽資料或換手機就會全部不見。`;
  } else if(d!==null && d>=7){
    lvl="bad"; msg=`已經 ${d} 天沒備份${drift>0?`，期間新增了 ${drift} 筆`:""}。建議現在匯出一份。`;
  } else if(d!==null && d>=3 && drift>0){
    lvl="warn"; msg=`上次備份是 ${d} 天前，之後又新增了 ${drift} 筆。`;
  }
  if(!lvl){ el.className="hide"; el.innerHTML=""; return; }
  el.className=lvl;
  el.innerHTML=`<h4>該備份了</h4><p>${msg}</p>
    <div class="btnrow">
      <button class="btn primary" id="bnExp">立即匯出備份</button>
      <button class="btn" id="bnLater">今天先不要</button>
    </div>`;
  document.getElementById("bnExp").onclick=exportBackup;
  document.getElementById("bnLater").onclick=()=>{ el.className="hide"; el.innerHTML=""; };
}
function exportBackup(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="代購清單備份_"+new Date().toISOString().slice(0,10)+".json";
  a.click(); URL.revokeObjectURL(a.href);
  S.meta.backupAt=Date.now(); S.meta.backupCount=S.items.length;
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
  paintBackup(); toast("備份檔已下載，記得存到雲端硬碟或傳給自己");
}
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2200);
}

/* ---------- 檔期 ---------- */
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function migrateTrips(){
  if(!Array.isArray(S.trips)) S.trips=[];
  const orphan=S.items.filter(i=>!i.tripId);
  if(orphan.length && !S.trips.length){
    const t={id:newId("t"),name:"未分類",start:"",end:"",rateSell:null,rateReal:null,refundMode:S.set.refundMode||"store",note:"",archived:false};
    S.trips=[t]; orphan.forEach(i=>i.tripId=t.id);
  } else if(orphan.length){
    orphan.forEach(i=>i.tripId=S.trips[0].id);
  }
  /* 退稅方式改成檔期層級後，既有檔期凍結在當時的全域設定，數字才不會回頭變動 */
  S.trips.forEach(t=>{ if(!t.refundMode) t.refundMode=S.set.refundMode||"store"; });
  if(!S.cur || (S.cur!=="all" && !S.trips.some(t=>t.id===S.cur)))
    S.cur = S.trips.length ? S.trips[0].id : "all";
}
const trip=id=>S.trips.find(t=>t.id===id)||null;
const tripName=id=>{const t=trip(id); return t?t.name:"未分類";};
const curTrip=()=>S.cur==="all"?null:trip(S.cur);
function tripItems(id){ return S.items.filter(i=>i.tripId===id); }

/* ---------- 計算 ---------- */
/* 匯率以單筆為準，沒有才退回設定值。報價後就該凍結，避免事後改設定影響已成交的單 */
const has=v=>v!=null&&v!=="";
/* 匯率三層：單筆 → 檔期 → 今日設定。代購匯率逐筆凍結，實際匯率跟著檔期走 */
const RS=it=>{ if(has(it&&it.rateSell)) return +it.rateSell;
  const t=it&&trip(it.tripId); return has(t&&t.rateSell)?+t.rateSell:(+S.set.rateSell||0); };
const RR=it=>{ if(has(it&&it.rateReal)) return +it.rateReal;
  const t=it&&trip(it.tripId); return has(t&&t.rateReal)?+t.rateReal:(+S.set.rateReal||0); };
/* 退稅方式綁在檔期上：2026/11 之後日本改成出境還付，不能用一個全域設定回頭改掉舊檔期 */
const RMODE=it=>{ const t=it&&trip(it.tripId); return (t&&t.refundMode)||S.set.refundMode||"store"; };
const RMODE_T={store:"店頭免稅", airport:"機場退稅"};
/* 新增商品時帶入的匯率：檔期有設就用檔期的，否則用今日設定 */
const defRS=()=>{const t=curTrip(); return (t&&t.rateSell!=null&&t.rateSell!=="")?t.rateSell:S.set.rateSell;};
const defRR=()=>{const t=curTrip(); return (t&&t.rateReal!=null&&t.rateReal!=="")?t.rateReal:S.set.rateReal;};
const today=()=>new Date().toISOString().slice(0,10);
const yen=n=>"¥"+Math.round(n).toLocaleString("ja-JP");
const twd=n=>"NT$"+Math.round(n).toLocaleString("zh-Hant-TW");
/* ===== 客人訂單：訂金、尾款都記在這一層 ===== */
function findOrder(tripId,customer){
  return S.orders.find(o=>(o.tripId||"")===(tripId||"") && (o.customer||"")===(customer||"")) || null;
}
function getOrder(tripId,customer){
  let o=findOrder(tripId,customer);
  if(!o){
    o={id:newId("o"), tripId:tripId||"", customer:customer||"", depAmt:null,
       depPaid:false, depPaidAt:"", balPaid:false, balPaidAt:"", refunded:false, note:""};
    S.orders.push(o);
  }
  return o;
}
const orderOf = it => it.kind==="buy" ? findOrder(it.tripId,it.customer||"") : null;
/* 商品都被刪掉、又沒記過任何金額的訂單是殘留資料，清掉；有記過錢的留著讓你自己處理 */
function pruneOrders(){
  const live=new Set(S.items.filter(i=>i.kind==="buy").map(i=>(i.tripId||"")+"\u0001"+(i.customer||"")));
  const dead=S.orders.filter(o=>!live.has((o.tripId||"")+"\u0001"+(o.customer||"")) && !(+o.depAmt));
  if(!dead.length) return 0;
  const ids=new Set(dead.map(o=>o.id));
  S.orders=S.orders.filter(o=>!ids.has(o.id));
  dead.forEach(o=>cloudDelOrder(o.id));
  return dead.length;
}
function orderItems(o){
  return S.items.filter(i=>i.kind==="buy" && (i.tripId||"")===(o.tripId||"") && (i.customer||"")===(o.customer||""));
}
/* 代購要收到訂金才開始買；自購隨時可買 */
const depOk = it => it.kind==="self" || (()=>{const o=orderOf(it); return !!(o&&o.depPaid);})();
const canBuy = it => it.state==="todo" && depOk(it);

function orderSum(o){
  const arr=orderItems(o);
  let charge=0, chargeGot=0, chargeMiss=0, cost=0, tax=0, qty=0;
  let nBought=0, nTodo=0, nMiss=0;
  arr.forEach(it=>{
    const m=calc(it); qty+=m.qty;
    if(it.state==="unavailable"){ chargeMiss+=m.charge; nMiss++; return; }
    charge+=m.charge;                                 /* 報價總額：含還沒買的 */
    if(it.state==="bought"){                          /* 真的花出去的錢只算買到的 */
      nBought++; chargeGot+=m.charge; cost+=m.cost; tax+=m.refund;
    } else nTodo++;
  });
  const depAuto = charge*((+S.set.depositPct||0)/100);
  const deposit = (o.depAmt==null||o.depAmt==="") ? depAuto : +o.depAmt;
  const ready = arr.length>0 && nTodo===0;            /* 這包全部有結果了，可以開賣貨便 */
  /* 尾款以「實際買到的」結算，買不到的那幾項不跟客人收 */
  const net = chargeGot - (o.depPaid?deposit:0);
  const depWait   = o.depPaid?0:deposit;
  const depHeld   = (o.depPaid && !o.balPaid)?deposit:0;
  const balDue    = (o.balPaid||!ready)?0:Math.max(0,net);
  const refundDue = (o.balPaid||!ready)?0:Math.max(0,-net);
  let phase;
  if(o.balPaid) phase="已結清";
  else if(arr.length && nMiss===arr.length) phase=(o.depPaid&&deposit>0)?"待退訂金":"全部買不到";
  else if(!o.depPaid) phase="待收訂金";
  else if(nTodo>0) phase="採購中";
  else phase="待收尾款";
  return {arr, n:arr.length, qty, charge, chargeGot, chargeMiss, cost, tax, profit:chargeGot-cost,
          depAuto, deposit, net, depWait, depHeld, balDue, refundDue,
          nBought, nTodo, nMiss, ready, phase};
}

/* ===== 店家結帳單：一張發票分攤到它涵蓋的商品 ===== */
function checkoutOf(it){
  return S.checkouts.find(c=>Array.isArray(c.itemIds)&&c.itemIds.includes(it.id))||null;
}
function allocFor(it){
  const co=checkoutOf(it); if(!co) return null;
  const members=S.items.filter(x=>co.itemIds.includes(x.id));
  const wt=x=>(+x.price||0)*Math.max(1,+x.qty||1);
  const W=members.reduce((a,x)=>a+wt(x),0);
  const share = W>0 ? wt(it)/W : (members.length?1/members.length:0);
  const yen = (co.yen===""||co.yen==null) ? null : +co.yen*share;
  const tt  = (co.twd===""||co.twd==null) ? null : (+co.twd + (+co.feeTwd||0));
  return {co, share, yen, twd: tt==null?null:tt*share};
}

/* ===== 單品計算 =====
   成本來源由準到粗：單品刷卡台幣 → 結帳單分攤 → 單品實付日幣 → 標價推估 */
function calc(it){
  const qty=Math.max(1,+it.qty||1), price=+it.price||0;
  const sub=price*qty;
  const r=(+S.set.taxRate||0)/100;
  const autoTax = r>0 ? sub/(1+r)*r : 0;
  /* 店頭免稅＝結帳當下已折抵，沒有稅可以再退；機場退稅＝實付含稅，之後才拿得回來 */
  const mode = RMODE(it);
  const refund = (it.taxOv===""||it.taxOv==null) ? (mode==="airport" ? autoTax : 0) : +it.taxOv;
  const tax = autoTax;                       /* 理論稅額：推估成本與「以退稅後價報價」時用 */
  const al = allocFor(it);
  const manualCard = (it.cardTwd===""||it.cardTwd==null) ? null : +it.cardTwd;
  const manualYen  = (it.paidYen===""||it.paidYen==null) ? null : +it.paidYen;
  const paid = manualYen!=null ? manualYen : (al && al.yen!=null ? al.yen : null);
  const yenOut = paid!=null
    ? (mode==="airport" ? Math.max(0, paid - paid/(1+r)*r) : paid)
    : (mode==="airport" ? sub - autoTax : sub - autoTax);
  const fee = 1 + (+S.set.cardFeePct||0)/100;
  const costEst = yenOut*RR(it)*fee;
  let cost=costEst, src="est";
  if(manualCard!=null){ cost=manualCard; src="card"; }
  else if(al && al.twd!=null){ cost=al.twd; src="checkout"; }
  else if(paid!=null){ src="paid"; }
  const base = S.set.base==="excl" ? (sub-tax) : sub;
  const autoCharge = base*RS(it);
  const charge = it.kind==="self" ? 0
    : ((it.chargeOv===""||it.chargeOv==null) ? autoCharge : +it.chargeOv);
  return {qty, sub, tax, refund, mode, paid, yenOut, costEst, cost, src,
          isActual: src==="card"||src==="checkout",
          charge, profit: it.kind==="self" ? 0 : charge-cost};
}

/* ---------- 篩選 ---------- */
function filtered(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const c=document.getElementById("fCust").value, st=document.getElementById("fStore").value;
  const ca=document.getElementById("fCat").value, se=document.getElementById("fState").value;
  const ki=document.getElementById("fKind").value;
  document.getElementById("clearF").classList.toggle("hide",!(q||c||st||ca||se||ki));
  return S.items.filter(it=>{
    if(S.cur!=="all" && it.tripId!==S.cur) return false;
    if(c && (it.customer||"")!==c) return false;
    if(st && (it.store||"")!==st) return false;
    if(ca && (it.category||"")!==ca) return false;
    if(se){
      if(se==="ready"){ if(!canBuy(it)) return false; }
      else if(se==="todo"){ if(it.state!=="todo"||canBuy(it)) return false; }
      else if(it.state!==se) return false;
    }
    if(ki && it.kind!==ki) return false;
    if(q){
      const hay=[it.nameZh,it.nameJa,it.spec,it.note,it.store,it.customer,it.category].join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

/* 統計分成「代購」和「自購」兩塊，彼此的錢不相加。
   上排＝還沒做完的事，下排＝這個檔期的結果。 */
function statSums(list){
  const ids=new Set(list.map(i=>i.id));
  const buys=list.filter(i=>i.kind==="buy"), selfs=list.filter(i=>i.kind==="self");
  /* 代購：金流看訂單，但只算清單裡有出現的訂單 */
  const seen=new Set(); const ords=[];
  buys.forEach(it=>{
    const o=orderOf(it); if(!o||seen.has(o.id)) return;
    seen.add(o.id); ords.push(o);
  });
  let depWait=0, depHeld=0, balWait=0, depRefund=0, bCost=0, bTax=0, bProfit=0;
  ords.forEach(o=>{
    const u=orderSum(o);
    depWait+=u.depWait; depHeld+=u.depHeld; balWait+=u.balDue; depRefund+=u.refundDue;
    bCost+=u.cost; bTax+=u.tax; bProfit+=u.profit;
  });
  let bQty=0; buys.forEach(it=>{ bQty+=Math.max(1,+it.qty||1); });
  let sCost=0,sTax=0,sQty=0;
  selfs.forEach(it=>{ const m=calc(it); sQty+=m.qty; if(it.state!=="bought") return; sCost+=m.cost; sTax+=m.refund; });
  return {depWait,depHeld,balWait,depRefund,bCost,bTax,bProfit,bQty,sCost,sTax,sQty,
          nBuy:buys.length, nSelf:selfs.length, nOrd:ords.length};
}
const SKEY=KEY+".statsOpen";
function statsOpen(){
  try{ const v=localStorage.getItem(SKEY); if(v!=null) return v==="1"; }catch(e){}
  return window.innerWidth>700;          /* 手機預設收起，桌機預設展開 */
}
function toggleStats(){

function renderStats(list){
  const f=statSums(list);
  const box=document.getElementById("stats");
  if(!f.nBuy && !f.nSelf){ box.innerHTML=`<div class="sgrp"><div class="sgh"><b>這個檔期還沒有商品</b></div></div>`; return; }
  const open=statsOpen();
  const cell=(k,v,col,sub)=>`<div class="stat${sub?" sub":""}"><div class="k">${k}</div><div class="v num"${col?` style="color:${col}"`:""}>${v}</div></div>`;
  const chev=`<button class="schev" data-stats="toggle" aria-label="${open?"收起":"展開"}統計">${open?"⌃":"⌄"}</button>`;

  if(!open){
    /* 收起時只留真正要盯的數字：還沒收的錢、這趟賺多少 */
    const due=f.depWait+f.balWait;
    const bits=[];
    if(due) bits.push(`<span class="kv">待收 <b class="num" style="color:var(--shu)">${twd(due)}</b></span>`);
    if(f.depRefund) bits.push(`<span class="kv">待退 <b class="num" style="color:var(--shu)">${twd(f.depRefund)}</b></span>`);
    if(!due && !f.depRefund) bits.push(`<span class="kv done">款項都結清了</span>`);
    bits.push(`<span class="kv">收益 <b class="num" style="color:${f.bProfit<0?"var(--shu)":"var(--matcha)"}">${twd(f.bProfit)}</b></span>`);
    box.innerHTML=`<div class="sgrp buy oneline peek" data-stats="toggle">
      <b>代購</b><span class="n">${f.nBuy} 項</span>
      <span class="sp"></span>${bits.join("")}${chev}</div>`;
    box.querySelectorAll("[data-stats]").forEach(e=>e.onclick=ev=>{ev.stopPropagation();toggleStats();});
    return;
  }

  const buyBlock=`
    <div class="sgrp buy">
      <div class="sgh"><b>代購</b><span>${f.nBuy} 項 · ${f.bQty} 件 · ${f.nOrd} 位客人</span><span class="sp"></span>${chev}</div>
      <div class="srow">
        ${cell("待收訂金",twd(f.depWait),"var(--amber)")}
        ${cell("已收訂金",twd(f.depHeld),"var(--matcha)")}
        ${cell("待收尾款",twd(f.balWait),"var(--shu)")}
        ${cell("待退訂金",twd(f.depRefund),f.depRefund?"var(--shu)":"var(--ink3)")}
        ${cell("刷卡金額",twd(f.bCost),"",1)}
        ${cell("預估收益",twd(f.bProfit),f.bProfit<0?"var(--shu)":"var(--matcha)",1)}
        ${cell("可退稅金額",yen(f.bTax),"",1)}
      </div>
      <div class="snote">後三項只計算<b>已買到</b>的商品</div>
    </div>`;
  const selfBlock = f.nSelf ? `
    <div class="sgrp self oneline">
      <b>自購</b><span class="n">${f.nSelf} 項 · ${f.sQty} 件</span>
      <span class="sp"></span>
      <span class="kv">刷卡 <b class="num">${twd(f.sCost)}</b></span>
      ${f.sTax?`<span class="kv">可退稅 <b class="num">${yen(f.sTax)}</b></span>`:""}
    </div>` : "";
  box.innerHTML=(f.nBuy?buyBlock:"")+selfBlock;
  box.querySelectorAll("[data-stats]").forEach(e=>e.onclick=ev=>{ev.stopPropagation();toggleStats();});
}

function handle(act,it){
  if(act==="cycle"){
    if(it.state==="todo"){
      if(it.kind==="buy" && !depOk(it) && !confirm("這位客人的訂金還沒收到，確定已經買了嗎？")) return;
      it.state="bought";
    }
    else it.state="todo";
    save(); cloudPut(it); render(); toast("已改為「"+ST[it.state].t+"」");
  }
  if(act==="miss"){
    it.state="unavailable";
    save(); cloudPut(it); render();
    const o=orderOf(it);
    toast(o&&o.depPaid ? "已標為買不到，請到對帳頁確認退款金額" : "已標為買不到");
  }
  if(act==="dup"){ dupItem(it); return; }
  if(act==="del"){
    if(confirm(`刪除「${it.nameZh||"這筆"}」？`)){
      S.items=S.items.filter(x=>x.id!==it.id); pruneOrders(); save(); cloudDel(it.id); render(); repaintTab(); toast("已刪除");
    }
  }
  if(act==="edit") openSheet(it);
  if(act==="mapItem"){
    if(it.url && /^https?:\/\//i.test(it.url)){
      window.open(it.url,"_blank","noopener"); return;     /* 有連結就直接開商品頁 */
    }
    const broken=/\?{3,}/.test(it.nameJa||"");
    const name=(!broken && it.nameJa) ? it.nameJa : it.nameZh;
    const kw=[name, it.store||""].filter(Boolean).join(" ");
    if(!kw){ toast("這筆沒有可搜尋的名稱"); return; }
    window.open("https://www.google.com/search?q="+encodeURIComponent(kw),"_blank","noopener");
  }
  if(act==="mapStore") openMap(it.store);
}
function openMap(kw){
  if(!kw){toast("這筆沒有可搜尋的名稱");return;}
  window.open("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(kw),"_blank","noopener");
}

    chargeOv:form.elements.chargeOv.value===""?null:form.elements.chargeOv.value,
    paidYen:form.elements.paidYen.value===""?null:form.elements.paidYen.value,
    cardTwd:form.elements.cardTwd.value===""?null:form.elements.cardTwd.value,
    rateSell:form.elements.rateSell.value===""?null:form.elements.rateSell.value,
    rateReal:null, tripId:form.elements.tripId.value
  };
  const m=calc(t);
  const pRow = m.paid!=null
    ? `<div class="row paid"><span class="lab">實付日幣</span><i class="dots"></i><span class="val num">${yen(m.paid)}</span></div>` : "";
  const cLab = m.isActual ? "刷卡帳單（實際）" : "我的成本（預估，匯率 "+RR(t)+"，含 "+S.set.cardFeePct+"% 手續費）";
  document.getElementById("calcBox").innerHTML = t.kind==="self"
    ? `<div class="row"><span class="lab">標價小計</span><i class="dots"></i><span class="val num">${yen(m.sub)}</span></div>
       ${m.refund?`<div class="row tax"><span class="lab">可退稅（${RMODE_T[m.mode]}）</span><i class="dots"></i><span class="val num">−${yen(m.refund)}</span></div>`:""}
       ${pRow}
       <div class="row total"><span class="lab">自付成本</span><i class="dots"></i><span class="val num" style="color:var(--ink)">${twd(m.cost)}</span></div>`
    : `<div class="row"><span class="lab">標價小計</span><i class="dots"></i><span class="val num">${yen(m.sub)}</span></div>
       ${m.refund?`<div class="row tax"><span class="lab">可退稅（${RMODE_T[m.mode]}）</span><i class="dots"></i><span class="val num">−${yen(m.refund)}</span></div>`:""}
       ${pRow}
       <div class="row ${m.isActual?"actual":""}"><span class="lab">${cLab}</span><i class="dots"></i><span class="val num">${twd(m.cost)}</span></div>
       <div class="row"><span class="lab">跟客人收</span><i class="dots"></i><span class="val num">${twd(m.charge)}</span></div>
       <div class="row total ${m.profit<0?"loss":""}"><span class="lab">賺</span><i class="dots"></i><span class="val num">${m.profit<0?"−":"+"}${twd(Math.abs(m.profit))}</span></div>
       <div class="row dep"><span class="lab">訂金／尾款</span><i class="dots"></i><span class="val" style="font-size:11.5px;color:var(--ink3)">整包訂單一起算，在「對帳」頁登記</span></div>`;
}

form.onsubmit=e=>{
  e.preventDefault();
  const d=Object.fromEntries(new FormData(form).entries());
  /* 自購時客人／訂金／實收是 disabled，不會出現在 FormData，統一補空字串 */
  ["nameZh","nameJa","spec","url","qty","kind","customer","store","category",
   "price","state","note","orderDate","rateSell","tripId",
   "taxOv","chargeOv","paidYen","cardTwd"].forEach(k=>{ if(d[k]===undefined) d[k]=""; });
  if(editId){
    const old=S.items.find(x=>x.id===editId), oo=old?orderOf(old):null;
    if(oo && oo.depPaid && +d.rateSell!==+old.rateSell){
      if(!confirm("「"+(old.customer||"這位客人")+"」的訂金已經收了，這筆匯率原本是 "+old.rateSell+"。\n改成 "+d.rateSell+" 會讓已收的訂金對不上，確定要改嗎？")) return;
    }
  }
  const rec={
    id: editId || (Date.now()+"."+Math.random().toString(36).slice(2,7)),
    ts: editId ? (S.items.find(x=>x.id===editId)||{}).ts || Date.now() : Date.now(),
    nameZh:String(d.nameZh).trim(), nameJa:String(d.nameJa).trim(),
    spec:String(d.spec).trim(), url:String(d.url).trim(),
    qty:Math.max(1,+d.qty||1), kind:d.kind||"buy", customer:String(d.customer).trim(),
    store:String(d.store).trim(), category:String(d.category).trim(),
    price:+d.price||0, state:d.state||"todo", note:String(d.note).trim(),
    taxOv: d.taxOv===""?null:+d.taxOv,
    chargeOv: d.chargeOv===""?null:+d.chargeOv,
    paidYen: d.paidYen===""?null:+d.paidYen,
    cardTwd: d.cardTwd===""?null:+d.cardTwd,
    rateSell: d.rateSell===""?defRS():+d.rateSell,
    /* 實際匯率不再逐筆填，留空＝跟著檔期／設定走；既有資料保留原值 */
    rateReal: editId ? ((S.items.find(x=>x.id===editId)||{}).rateReal ?? null) : null,
    tripId: d.tripId || S.cur!=="all" && S.cur || (S.trips[0]&&S.trips[0].id) || "",
    orderDate: d.orderDate||today(),
    img: pendingImg
  };
  if(editId){ S.items=S.items.map(x=>x.id===editId?rec:x); }
  else{ S.items.unshift(rec); }
  /* 代購一定要有一張客人訂單掛著，訂金尾款才有地方記 */
  if(rec.kind==="buy"){ const o=getOrder(rec.tripId,rec.customer); cloudPutOrder(o); }
  save(); cloudPut(rec); closeSheet(); render(); toast(editId?"已更新":"已新增");
};
document.getElementById("delBtn").onclick=()=>{
  if(!editId) return;
  if(confirm("刪除這筆？")){
    const _d=editId; S.items=S.items.filter(x=>x.id!==editId); pruneOrders(); save(); cloudDel(_d); closeSheet(); render(); repaintTab(); toast("已刪除");
  }
};
document.getElementById("addBtn").onclick=()=>{
  if(!S.trips.length){ openTrip(null); toast("先建一個檔期，再開始加商品"); return; }
  openSheet(null);
};

/* ---------- 對帳：以「客人訂單」為單位，整包收訂金、整包收尾款 ---------- */
let saleOpen={};
function renderLedger(){
  const box=document.getElementById("viewLedger");
  const buys=S.items.filter(i=>i.kind==="buy" && (S.cur==="all"||i.tripId===S.cur));
  if(!buys.length){ box.innerHTML=`<div class="empty"><h3>還沒有代購項目</h3><p>新增商品時把類型選成「代購」並填上客人，這裡就會自動分組結帳。</p></div>`; return; }
  const seen=new Set(), ords=[];
  buys.forEach(it=>{ const o=getOrder(it.tripId,it.customer||""); if(!seen.has(o.id)){ seen.add(o.id); ords.push(o); } });
  /* 商品被刪光但還記著訂金的，不能默默消失 */
  S.orders.forEach(o=>{
    if(seen.has(o.id)) return;
    if(S.cur!=="all" && o.tripId!==S.cur) return;
    if(+o.depAmt) { seen.add(o.id); ords.push(o); }
  });
  const PH={"待收訂金":"wait","採購中":"go","待收尾款":"mid","待退訂金":"alert","全部買不到":"done","已結清":"done"};
  ords.sort((a,b)=>{
    const r={"待收尾款":0,"待退訂金":1,"待收訂金":2,"採購中":3,"全部買不到":4,"已結清":5};
    return (r[orderSum(a).phase]-r[orderSum(b).phase]) || String(a.customer).localeCompare(String(b.customer));
  });
  box.innerHTML=ords.map(o=>{
    const u=orderSum(o);
    const name=o.customer||"（未指定客人）";
    const rows=u.arr.slice().sort((x,y)=>ORDER[x.state]-ORDER[y.state]).map(it=>{
      const m=calc(it), st=ST[it.state]||ST.todo;
      const lab = it.state==="todo" ? (canBuy(it)?"可以買":"等訂金") : st.t;
      const col = it.state==="bought"?"var(--matcha)" : it.state==="unavailable"?"var(--shu)"
                : canBuy(it)?"var(--matcha)":"var(--amber)";
      return `<tr${it.state==="unavailable"?' style="opacity:.55"':''}>
        <td>${esc(it.nameZh)}${it.spec?`<div style="color:var(--ink3);font-size:11.5px">${esc(it.spec)}</div>`:""}</td>
        <td class="n num">${m.qty}</td>
        <td class="n num">${it.state==="unavailable"?"—":twd(m.charge)}</td>
        <td class="n num" style="color:var(--ink3)">${RS(it)}</td>
        <td class="n" style="color:${col}">${lab}</td>
      </tr>`;
    }).join("");
    const depVal = Math.round(u.deposit);
    const auto = (o.depAmt==null||o.depAmt==="");
    const sale = saleOpen[o.id] ? `<pre class="salebox">${esc(saleText(o))}</pre>
        <div class="btnrow" style="margin:9px 14px 12px"><button class="act" data-ord="saleCopy" data-id="${o.id}">複製這段</button></div>` : "";
    return `<section class="ledger ord ${o.balPaid?"settled":""}">
      <div class="lhead">
        <h3>${esc(name)}</h3>
        <span class="phase ${PH[u.phase]}">${u.phase}</span>
        <span class="cnt num">${u.n} 項 · ${u.qty} 件${u.nMiss?` · ${u.nMiss} 項買不到`:""}</span>
        <span class="spacer"></span>
        <button class="act" data-ord="copyDep" data-id="${o.id}">複製訂金通知</button>
        <button class="act go" data-ord="sale" data-id="${o.id}">${saleOpen[o.id]?"收起":"賣貨便清單"}</button>
      </div>

      <div class="paybar">
        <div class="pay">
          <div class="k">應收總額</div>
          <div class="v num">${twd(u.charge)}</div>
          ${u.nMiss?`<div class="sub">買不到 ${twd(u.chargeMiss)} 已扣除</div>`:""}
        </div>
        <div class="pay ${o.depPaid?"on":""}">
          <div class="k">訂金<span class="mini">${auto?`自動 ${S.set.depositPct}%`:(o.depPaid?"實收":"手動")}</span></div>
          <div class="pedit">
            <input class="pin num" type="number" min="0" step="1" data-dep="${o.id}" value="${depVal}" ${o.depPaid?"":""}>
            ${auto?"":`<button class="act" data-ord="depAuto" data-id="${o.id}" title="改回自動計算">↺</button>`}
          </div>
          ${(o.depPaid&&o.depPaidAt)?`<div class="sub">${o.depPaidAt} 收到</div>`:""}
          <button class="act ${o.depPaid?"":"state"}" data-ord="depToggle" data-id="${o.id}">${o.depPaid?"取消收款":"訂金收到了"}</button>
        </div>
        <div class="pay ${o.balPaid?"on":""}">
          ${(()=>{
            /* 全部有結果了才結算；還在採購中只給預估，免得誤以為要退錢 */
            const est = u.charge - (o.depPaid?u.deposit:0);
            const v = u.ready ? u.net : est;
            const lab = !u.ready ? "尾款（預估）" : (v<0?"應退客人":"尾款");
            const sub = !u.ready ? `還有 ${u.nTodo} 項沒結果，買到才算數`
                      : (u.nMiss ? `已扣掉 ${u.nMiss} 項買不到` : (o.depPaid?"":"訂金收了才開始算"));
            return `<div class="k">${lab}</div>
          <div class="v num" style="color:${v<0?"var(--shu)":"var(--ink)"}">${twd(Math.abs(v))}</div>
          ${sub?`<div class="sub">${sub}</div>`:""}`;
          })()}
          ${(o.balPaid&&o.balPaidAt)?`<div class="sub">${o.balPaidAt} 結清</div>`:""}
          <button class="act ${o.balPaid?"":"state"}" data-ord="balToggle" data-id="${o.id}" ${(!o.depPaid&&!o.balPaid)?"disabled":""}>${o.balPaid?"取消結清":(u.refundDue>0?"訂金已退":"尾款收到了")}</button>
        </div>
        <div class="pay quiet">
          <div class="k">刷卡金額<span class="mini">已買到 ${u.nBought} 項</span></div>
          <div class="v num">${twd(u.cost)}</div>
          <div class="sub"><span class="nw">預估收益 <b style="color:${u.profit<0?"var(--shu)":"var(--matcha)"}">${twd(u.profit)}</b></span>${u.tax?`　·　<span class="nw">可退稅 ${yen(u.tax)}</span>`:""}</div>
        </div>
      </div>
      ${sale}
      <div class="lttbl"><table class="lt"><thead><tr><th>商品</th><th class="n">件</th><th class="n">應收</th><th class="n">匯率</th><th class="n">狀態</th></tr></thead><tbody>${rows}</tbody></table></div>
    </section>`;
  }).join("") + auditPanel();

  box.querySelectorAll("[data-audit]").forEach(b=>b.onclick=()=>auditAction(b.dataset.audit));
  box.querySelectorAll("[data-dep]").forEach(inp=>{
    inp.onchange=()=>{
      const o=S.orders.find(x=>x.id===inp.dataset.dep); if(!o) return;
      const v=inp.value.trim();
      o.depAmt = v===""?null:Math.max(0,+v);
      save(); cloudPutOrder(o); renderLedger(); render();
    };
  });
  box.querySelectorAll("[data-ord]").forEach(b=>b.onclick=()=>ordAction(b.dataset.ord,b.dataset.id));
}

/* ===== 收益核帳：把統計那個數字拆開給你看 =====
   每一項的應收、成本、成本是怎麼來的、賺多少，合計必定等於上方的「預估收益」。 */
let auditOpen=false;
function auditRows(){
  const live=S.items.filter(i=>S.cur==="all"||i.tripId===S.cur);
  return live.map(it=>{
    const m=calc(it);
    const o=orderOf(it);
    let inc=false, why="";
    if(it.kind==="self"){ why="自購，不計代購收益"; }
    else if(it.state==="todo"){ why = depOk(it)?"還沒標「已買到」":"訂金未收、還沒買"; }
    else if(it.state==="unavailable"){ why="買不到，不跟客人收也沒成本"; }
    else inc=true;
    const co=checkoutOf(it);
    return {it, m, o, co, inc, why,
            charge: inc?m.charge:0, cost: inc?m.cost:0, profit: inc?(m.charge-m.cost):0};
  });
}
const SRC_SHORT={card:"單品刷卡", checkout:"結帳單分攤", paid:"實付日幣換算", est:"標價推估"};
function auditPanel(){
  const rows=auditRows();
  const inc=rows.filter(r=>r.inc), out=rows.filter(r=>!r.inc);
  const tCharge=inc.reduce((a,r)=>a+r.charge,0);
  const tCost=inc.reduce((a,r)=>a+r.cost,0);
  const tProfit=tCharge-tCost;
  const est=inc.filter(r=>r.m.src==="est");
  const head=`<section class="ledger audit">
    <div class="lhead"><h3>收益核帳</h3>
      <span class="cnt num">計入 ${inc.length} 項 · 未計入 ${out.length} 項${S.cur!=="all"?" · "+RMODE_T[(curTrip()&&curTrip().refundMode)||S.set.refundMode||"store"]:""}</span>
      <span class="spacer"></span>
      <button class="act" data-audit="csv">匯出明細 CSV</button>
      <button class="act go" data-audit="toggle">${auditOpen?"收起":"展開明細"}</button></div>
    <div class="auditsum">
      <div><div class="k">應收合計</div><div class="v num">${twd(tCharge)}</div></div>
      <div><div class="k">成本合計</div><div class="v num">${twd(tCost)}</div></div>
      <div><div class="k">預估收益</div><div class="v num" style="color:${tProfit<0?"var(--shu)":"var(--matcha)"}">${twd(tProfit)}</div></div>
    </div>`;
  if(!auditOpen){
    const hints=[];
    if(out.filter(r=>r.it.kind==="buy"&&r.it.state==="todo").length)
      hints.push(`有 <b>${out.filter(r=>r.it.kind==="buy"&&r.it.state==="todo").length}</b> 項代購還沒標「已買到」，應收和成本都沒算進去`);
    if(est.length)
      hints.push(`有 <b>${est.length}</b> 項的成本是<b>標價推估</b>的，跟實際卡單會有落差 — 建議到「採購」頁建結帳單`);
    if(S.cur!=="all") hints.push(`目前只算「${tripName(S.cur)}」這個檔期，切到「— 全部檔期 —」才是全部`);
    return head+(hints.length?`<ul class="audithint">${hints.map(h=>`<li>${h}</li>`).join("")}</ul>`:"")+`</section>`;
  }
  const tr=r=>{
    const it=r.it, m=r.m;
    const stLab = it.kind==="self" ? "自購" : (it.state==="todo"?(depOk(it)?"可以買":"等訂金"):(ST[it.state]||ST.todo).t);
    return `<tr class="${r.inc?"":"skip"}">
      <td>${esc(it.nameZh||"未命名")}${it.spec?`<div class="sub2">${esc(it.spec)}</div>`:""}</td>
      <td>${it.kind==="self"?"—":esc(it.customer||"未指定")}</td>
      <td class="n num">${m.qty}</td>
      <td class="n">${stLab}</td>
      <td class="n num">${yen(m.sub)}</td>
      <td class="n num">${RS(it)}</td>
      <td class="n num">${r.inc?twd(m.charge):"—"}</td>
      <td class="n num">${r.inc?twd(m.cost):"—"}</td>
      <td class="n"><span class="srctag ${m.src}">${SRC_SHORT[m.src]}</span>${r.co?`<div class="sub2">${esc(r.co.store||"")}${r.co.label?" "+esc(r.co.label):""}</div>`:""}</td>
      <td class="n num" style="color:${!r.inc?"var(--ink3)":(r.profit<0?"var(--shu)":"var(--matcha)")}">${r.inc?twd(r.profit):"—"}</td>
      <td class="sub2">${esc(r.why)}</td>
    </tr>`;
  };
  return head+`<div class="audittbl"><table class="lt at">
    <thead><tr><th>商品</th><th>客人</th><th class="n">件</th><th class="n">狀態</th><th class="n">標價¥</th><th class="n">匯率</th><th class="n">應收</th><th class="n">成本</th><th class="n">成本來源</th><th class="n">賺</th><th>未計入原因</th></tr></thead>
    <tbody>${inc.map(tr).join("")}${out.map(tr).join("")}</tbody>
    <tfoot><tr><td colspan="6">合計（只含計入的 ${inc.length} 項）</td>
      <td class="n num">${twd(tCharge)}</td><td class="n num">${twd(tCost)}</td><td></td>
      <td class="n num" style="color:${tProfit<0?"var(--shu)":"var(--matcha)"}">${twd(tProfit)}</td><td></td></tr></tfoot>
  </table></div></section>`;
}
function auditAction(act){
  if(act==="toggle"){ auditOpen=!auditOpen; renderLedger(); return; }
  if(act==="csv"){
    const rows=auditRows();
    const H=["商品","日文名","規格","客人","店家","類型","數量","狀態","標價日幣","代購匯率","實際匯率","實付日幣","應收台幣","成本台幣","成本來源","結帳單","賺","計入收益","未計入原因","檔期"];
    const q=v=>{const t=String(v??""); return /[",\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t;};
    const lines=[H.join(",")];
    rows.forEach(r=>{
      const it=r.it,m=r.m;
      lines.push([it.nameZh,it.nameJa,it.spec,it.kind==="self"?"":it.customer,it.store,
        it.kind==="self"?"自購":"代購",m.qty,(ST[it.state]||ST.todo).t,Math.round(m.sub),
        RS(it),RR(it),m.paid==null?"":Math.round(m.paid),
        r.inc?Math.round(m.charge):"",r.inc?Math.round(m.cost):"",
        SRC_SHORT[m.src],r.co?((r.co.store||"")+(r.co.label?" "+r.co.label:"")):"",
        r.inc?Math.round(r.profit):"",r.inc?"是":"否",r.why,tripName(it.tripId)].map(q).join(","));
    });
    const inc=rows.filter(r=>r.inc);
    lines.push("");
    lines.push([q("合計（計入 "+inc.length+" 項）"),"","","","","","","","","","","",
      Math.round(inc.reduce((a,r)=>a+r.charge,0)),Math.round(inc.reduce((a,r)=>a+r.cost,0)),
      "","",Math.round(inc.reduce((a,r)=>a+r.profit,0)),"","",""].join(","));
    const blob=new Blob(["\uFEFF"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="收益核帳_"+(S.cur==="all"?"全部檔期":tripName(S.cur))+"_"+today()+".csv";
    a.click(); URL.revokeObjectURL(a.href);
    toast("已下載，用 Excel 開啟可直接跟你的帳比對");
  }
}

function ordAction(act,id){
  const o=S.orders.find(x=>x.id===id); if(!o) return;
  const u=orderSum(o);
  if(act==="depToggle"){
    if(o.depPaid){ if(!confirm("取消「訂金已收」？")) return; o.depPaid=false; o.depPaidAt=""; }
    else{
      if(o.depAmt==null||o.depAmt==="") o.depAmt=Math.round(u.depAuto);  /* 收款當下把金額定下來 */
      o.depPaid=true; o.depPaidAt=today();
    }
    save(); cloudPutOrder(o); renderLedger(); render();
    toast(o.depPaid?`已記錄訂金 ${twd(o.depAmt)}，可以開始採購`:"已取消訂金紀錄");
  }
  if(act==="balToggle"){
    if(o.balPaid){ if(!confirm("取消「已結清」？")) return; o.balPaid=false; o.balPaidAt=""; }
    else{
      if(u.nTodo>0 && !confirm(`還有 ${u.nTodo} 項沒有採購結果，確定要結清嗎？`)) return;
      o.balPaid=true; o.balPaidAt=today();
    }
    save(); cloudPutOrder(o); renderLedger(); render();
    toast(o.balPaid?"已結清":"已取消結清");
  }
  if(act==="depAuto"){ o.depAmt=null; save(); cloudPutOrder(o); renderLedger(); render(); toast("訂金改回自動計算"); }
  if(act==="sale"){ saleOpen[o.id]=!saleOpen[o.id]; renderLedger(); }
  if(act==="saleCopy"){ copyText(saleText(o),"賣貨便清單已複製"); }
  if(act==="copyDep"){ copyText(depText(o),"訂金通知已複製"); }
}

/* 賣貨便上架用：只列買到的東西、數量、要收的尾款 */
function saleText(o){
  const u=orderSum(o);
  const got=u.arr.filter(i=>i.state==="bought");
  const miss=u.arr.filter(i=>i.state==="unavailable");
  const tn=S.cur==="all"?"":`${tripName(o.tripId)}`;
  const L=[];
  L.push("【"+(o.customer||"未指定客人")+"】"+(tn?tn:"")+"代購");
  if(!got.length) L.push("（還沒有買到的商品）");
  got.forEach(it=>{
    const m=calc(it);
    L.push(it.nameZh+(it.spec?"（"+it.spec+"）":"")+" ×"+m.qty);
  });
  if(miss.length){
    L.push("—");
    miss.forEach(it=>L.push("✕ "+it.nameZh+(it.spec?"（"+it.spec+"）":"")+" 買不到"));
  }
  L.push("—");
  L.push("商品合計 "+twd(u.chargeGot));
  if(o.depPaid) L.push("已收訂金 −"+twd(u.deposit));
  if(u.net<0) L.push("應退還你 "+twd(-u.net));
  else L.push("賣貨便收款 "+twd(u.net));
  if(u.nTodo>0) L.push("（還有 "+u.nTodo+" 項還沒有採購結果，金額可能會再變動）");
  return L.join("\n");
}
function depText(o){
  const u=orderSum(o);
  const live=u.arr.filter(i=>i.state!=="unavailable");
  if(!live.length) return "（這位客人沒有可報價的項目）";
  const rs=[...new Set(live.map(x=>RS(x)))];
  const tn=S.cur==="all"?"":`（${tripName(o.tripId)}）`;
  const L=["【"+(o.customer||"未指定客人")+"】"+tn+"代購確認"];
  live.forEach((it,i)=>{
    const m=calc(it);
    L.push((i+1)+". "+it.nameZh+(it.spec?"（"+it.spec+"）":"")+" ×"+m.qty+"　"+twd(m.charge));
  });
  L.push("—");
  L.push("總金額 "+twd(u.charge));
  L.push("訂金 "+twd(u.deposit)+(o.depAmt==null?"（"+S.set.depositPct+"%）":""));
  L.push("換算匯率 "+rs.join("／"));
  L.push("收到訂金後開始採購；若當地缺貨買不到，這部分會全額退回。");
  return L.join("\n");
}
function copyText(txt,okMsg){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast(okMsg||"已複製"),()=>toast("複製失敗，請手動選取"));

}

/* 口徑跟統計面板一致：代購與自購分開，且只算已買到的 */
function tripSums(id){
  const arr=tripItems(id);
  let cost=0,charge=0,profit=0,selfCost=0;
  arr.forEach(it=>{
    if(it.state!=="bought") return;
    const m=calc(it);
    if(it.kind==="self"){ selfCost+=m.cost; return; }
    cost+=m.cost; charge+=m.charge; profit+=m.profit;
  });
  let depWait=0,balWait=0;
  S.orders.filter(o=>(o.tripId||"")===id).forEach(o=>{
    const u=orderSum(o); depWait+=u.depWait; balWait+=u.balDue;
  });
  return {n:arr.length,cost,selfCost,charge,profit,depWait,balWait};
}
function renderTrips(){
  const box=document.getElementById("tripList"); if(!box) return;
  if(!S.trips.length){ box.innerHTML=`<p class="hint">還沒有檔期。按上面的「新增檔期」開始。</p>`; return; }

function tripAction(act,id){
  const t=trip(id); if(!t) return;
  if(act==="edit") openTrip(t);
  if(act==="arch"){
    t.archived=!t.archived;
    if(t.archived && S.cur===id){ const o=S.trips.find(x=>!x.archived); S.cur=o?o.id:"all"; }
    save(); cloudPutTrip(t); render(); renderSettings();
    toast(t.archived?"已封存":"已取消封存");
  }
  if(act==="del"){
    const n=tripItems(id).length;
    if(n){
      const move=confirm(`「${t.name}」底下還有 ${n} 筆商品。\n\n按「確定」把這些商品搬到另一個檔期；按「取消」連同商品一起刪除。`);
      if(move){
        const others=S.trips.filter(x=>x.id!==id);
        if(!others.length){ toast("沒有其他檔期可以搬，請先新增一個"); return; }
        const to=prompt("搬到哪個檔期？請輸入編號：\n"+others.map((x,i)=>`${i+1}. ${x.name}`).join("\n"),"1");
        const k=others[(+to||1)-1]; if(!k) return;
        tripItems(id).forEach(it=>{ it.tripId=k.id; cloudPut(it); });
      } else {
        if(!confirm(`確定要連同 ${n} 筆商品一起刪除？這個動作無法復原。`)) return;
        tripItems(id).forEach(it=>cloudDel(it.id));
        S.items=S.items.filter(it=>it.tripId!==id);
      }
    }
    S.orders.filter(o=>o.tripId===id).forEach(o=>cloudDelOrder(o.id));
    S.orders=S.orders.filter(o=>o.tripId!==id);
    S.checkouts.filter(c=>c.tripId===id).forEach(c=>cloudDelCo(c.id));
    S.checkouts=S.checkouts.filter(c=>c.tripId!==id);
    S.trips=S.trips.filter(x=>x.id!==id);
    if(S.cur===id) S.cur=S.trips.length?S.trips[0].id:"all";
    save(); cloudDelTrip(id); render(); renderSettings(); toast("已刪除檔期");
  }
}
