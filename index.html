                          : live.filter(it=>it.state==="todo");

}

/* 結帳單編輯：選店家 → 勾這張發票涵蓋的商品 → 填金額 */
let coId=null;
const coSheet=document.getElementById("coSheet"), coForm=document.getElementById("coForm");
function coCandidates(store){
  const tid=S.cur==="all"?null:S.cur;
  return S.items.filter(it=>{
    if(tid && it.tripId!==tid) return false;
    if(it.state==="unavailable") return false;
    const used=checkoutOf(it);
    if(used && used.id!==coId) return false;        /* 已經被別張發票吃掉 */
    if(store && (it.store||"")!==store) return false;
    return true;
  });
}
function openCo(c,store){
  coId = c?c.id:null;
  document.getElementById("coTitle").textContent = c?"編輯結帳單":"新增結帳單";

  sel.innerHTML=`<option value="">（全部店家）</option>`+stores.map(v=>`<option${v===(c?c.store:store)?" selected":""}>${esc(v)}</option>`).join("");

function coPickInit(pre){
  const picked=new Set(pre||[]);
  coSheet._picked=picked;
  coPaintPick();
}
function coPaintPick(){
  const box=document.getElementById("coPick");
  const store=coForm.elements.store.value;
  const cands=coCandidates(store);
  const picked=coSheet._picked;
  if(!cands.length){ box.innerHTML=`<p class="hint" style="margin:0">這個店家沒有可結帳的商品（買不到的、或已經在別張結帳單裡的不會出現）。</p>`; coPaintSum(); return; }
  box.innerHTML=cands.map(it=>{
    const q=Math.max(1,+it.qty||1), sub=(+it.price||0)*q;
    return `<label class="pickrow${picked.has(it.id)?" on":""}">
      <input type="checkbox" data-pick="${it.id}" ${picked.has(it.id)?"checked":""}>
      <span class="pn">${esc(it.nameZh||"未命名")}${it.spec?`<i>${esc(it.spec)}</i>`:""}</span>
      <span class="pw">${it.kind==="self"?"自購":esc(it.customer||"未指定")}</span>
      <span class="pq num">×${q}</span>
      <span class="pp num">${yen(sub)}</span>
    </label>`;
  }).join("");

  tripName:["檔期","行程"]
};
/* 舊的狀態字樣也收，一律對到新的三種 */
const IMP_STATE={"待收訂金":"todo","等訂金":"todo","未收訂金":"todo","可以買":"todo",
  "已收訂金":"todo","待買":"todo","自購待買":"todo",
  "已購":"bought","待收尾款":"bought","已買":"bought","已買到":"bought","已結清":"bought","結清":"bought",
  "買不到":"unavailable","缺貨":"unavailable","已退訂金":"unavailable"};
/* 匯入時若標了「已收訂金／已結清」，順手把客人訂單的狀態也帶起來 */
const IMP_DEP=["已收訂金","可以買","已購","待收尾款","已買","已買到","已結清","結清"];
const IMP_BAL=["已結清","結清"];

/* 支援逗號或 Tab 分隔、引號包住的欄位、換行與 BOM */
function parseTable(text){
  text=text.replace(/^\uFEFF/,"").replace(/\r\n?/g,"\n").trim();
  if(!text) return [];
  const head=text.split("\n")[0];
  const sep=(head.split("\t").length>head.split(",").length)?"\t":",";
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; }
      else cell+=c;
    } else if(c==='"'){ q=true; }
    else if(c===sep){ row.push(cell); cell=""; }
    else if(c==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
    else cell+=c;
  }
  row.push(cell); rows.push(row);
  const out=rows.filter(r=>r.some(x=>String(x).trim()!==""));
  /* 連續貼好幾段（每段都帶標題列）時，後面重複的標題自動略過 */
  if(out.length>1){
    const h=out[0].join("\u0001");
    return out.filter((r,i)=>i===0||r.join("\u0001")!==h);
  }
  return out;
}
function mapHeader(cells){
  const map={};
  cells.forEach((raw,i)=>{
    const h=String(raw).trim().replace(/[\s()（）*＊:：]/g,"");
    for(const key in IMP_COLS){
      if(IMP_COLS[key].some(a=>h===a||h.startsWith(a))){ map[key]=i; break; }
    }
  });
  return map;
}
function importRows(text,dryRun){
  const rows=parseTable(text);
  if(rows.length<2) return {err:"至少要有標題列和一列資料"};
  const map=mapHeader(rows[0]);
  if(map.nameZh===undefined) return {err:"找不到「商品名稱」欄位，請確認標題列"};
  if(map.price===undefined) return {err:"找不到「單價」欄位，請確認標題列"};
  const out=[], warn=[], seenTrip=new Set();
  const num=v=>{ const n=parseFloat(String(v??"").replace(/[^\d.-]/g,"")); return isNaN(n)?null:n; };
  const get=(r,k)=>map[k]===undefined?"":String(r[map[k]]??"").trim();
  rows.slice(1).forEach((r,idx)=>{
    const line=idx+2;
    const nameZh=get(r,"nameZh");
    if(!nameZh) return;
    const price=num(get(r,"price"));
    if(price===null){ warn.push("第 "+line+" 列：單價不是數字，略過"); return; }
    let tripId=S.cur!=="all"?S.cur:(S.trips[0]&&S.trips[0].id)||"";
    const tn=get(r,"tripName");
    if(tn){
      let t=S.trips.find(x=>x.name===tn);
      if(!t && !dryRun){ t={id:newId("t"),name:tn,start:"",end:"",rateSell:null,rateReal:null,refundMode:S.set.refundMode||"store",note:"",archived:false}; S.trips.push(t); cloudPutTrip(t); }
      if(t) tripId=t.id;
      else if(dryRun && !seenTrip.has(tn)){ seenTrip.add(tn); warn.push("會新建檔期「"+tn+"」"); }
    }
    const kindRaw=get(r,"kind");
    const kind=/自購|自用|自己/.test(kindRaw)?"self":"buy";
    const stRaw=get(r,"state");
    let st=IMP_STATE[stRaw] || "todo";
    const tObj=S.trips.find(x=>x.id===tripId);
    const defSell=(tObj&&tObj.rateSell!=null&&tObj.rateSell!=="")?tObj.rateSell:S.set.rateSell;
    out.push({
      id:newId("i"), ts:Date.now()-out.length, tripId,
      nameZh, nameJa:get(r,"nameJa"), spec:get(r,"spec"), url:get(r,"url"),
      qty:Math.max(1,Math.round(num(get(r,"qty"))||1)),
      kind, customer:kind==="self"?"":get(r,"customer"),
      store:get(r,"store"), category:get(r,"category"),
      price, state:st, note:get(r,"note"),
      orderDate:get(r,"orderDate")||today(),
      rateSell:num(get(r,"rateSell"))??defSell,
      rateReal:num(get(r,"rateReal")),           /* 沒填＝跟著檔期 */
      taxOv:num(get(r,"taxOv")), chargeOv:num(get(r,"chargeOv")),
      paidYen:num(get(r,"paidYen")), cardTwd:num(get(r,"cardTwd")), img:null,
      _depPaid: IMP_DEP.includes(stRaw), _balPaid: IMP_BAL.includes(stRaw),
      _depOv: num(get(r,"depOv"))
    });
  });
  return {items:out, warn};
}
/* Excel 在繁中 Windows 預設存成 Big5，用 UTF-8 讀會整片亂碼，所以要先試幾種 */
function decodeCsv(buf){
  const tries=[["utf-8",true],["big5",false],["gb18030",false],["shift_jis",false]];
  for(const [enc,fatal] of tries){
    try{
      const t=new TextDecoder(enc,fatal?{fatal:true}:undefined).decode(buf);
      if(fatal) return {text:t,enc:"UTF-8"};
      if(!t.includes("\uFFFD")) return {text:t,enc:enc.toUpperCase()};
    }catch(e){}
  }
  return {text:new TextDecoder("utf-8").decode(buf),enc:"UTF-8（可能有缺字）"};
}

  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});

    <section class="panel">
      <h3>算法說明</h3>
      <p class="hint" style="margin-bottom:10px">每一筆的錢是這樣算出來的，有疑問時可以回來對。</p>
      <div class="row"><span class="lab">標價小計</span><i class="dots"></i><span class="val">當地單價 × 數量</span></div>
      <div class="row"><span class="lab">理論稅額</span><i class="dots"></i><span class="val">標價小計 ÷ (1 + 稅率) × 稅率</span></div>
      <div class="row tax"><span class="lab">可退稅金額</span><i class="dots"></i><span class="val"><b>店頭免稅</b>＝0（結帳已折抵）；<b>機場退稅</b>＝理論稅額</span></div>
      <div class="row"><span class="lab">日圓實際支出</span><i class="dots"></i><span class="val">有結帳單就用分攤到的金額（機場退稅時再扣掉會退回來的稅），否則用 標價小計 − 理論稅額</span></div>
      <div class="row"><span class="lab">跟客人收</span><i class="dots"></i><span class="val">${S.set.base==="incl"?"標價小計":"退稅後金額"} × <b>本筆</b>代購匯率</span></div>
      <div class="row total"><span class="lab">賺</span><i class="dots"></i><span class="val">跟客人收 − 我的成本</span></div>
      <p class="hint" style="margin:14px 0 6px"><b>成本的四種來源</b>，由準到粗，有哪個就用哪個：</p>
      <div class="row actual"><span class="lab">1　單品刷卡台幣</span><i class="dots"></i><span class="val">在商品裡填了「刷卡帳單 NT$」</span></div>
      <div class="row actual"><span class="lab">2　結帳單分攤</span><i class="dots"></i><span class="val">整張發票的刷卡台幣＋手續費，依標價比例分到每項</span></div>
      <div class="row"><span class="lab">3　實付日幣換算</span><i class="dots"></i><span class="val">實付 ¥ × <b>本筆</b>實際匯率 × (1 + ${S.set.cardFeePct}% 手續費)</span></div>
      <div class="row"><span class="lab">4　標價推估</span><i class="dots"></i><span class="val">(標價小計 − 理論稅額) × 實際匯率 × (1 + ${S.set.cardFeePct}%)</span></div>
      <p class="hint" style="margin:10px 0 0">實際匯率取用順序：<b>檔期設定 → 今日設定</b>。2026/10 之前建立的商品若有自己的匯率，會沿用原值不動。</p>
      <p class="hint" style="margin:12px 0 0">店家結帳是一張發票一次刷，不是一件一件刷，所以成本請走「採購」頁的<b>結帳</b>功能：勾選這張發票買了哪些、填實付日幣，卡單出來再補台幣和手續費。</p>
    </section>`;

  document.getElementById("applyRate").onclick=()=>{
    const t=S.items.filter(i=>{
      if(i.state!=="todo") return false;
      if(i.kind==="self") return true;
      const o=orderOf(i); return !(o&&o.depPaid);
    });
    if(!t.length){ toast("沒有未鎖定的項目"); return; }
    if(!confirm("把 "+t.length+" 筆未鎖定項目的代購匯率改成 "+S.set.rateSell+" ？")) return;
    t.forEach(i=>{ i.rateSell=S.set.rateSell; cloudPut(i); });
    save(); render(); renderSettings(); toast("已套用到 "+t.length+" 筆");
  };

  const fh=document.getElementById("fbHint");

      none:"<b>目前：未設定</b>。可以貼在下面的框裡，或寫進 HTML 檔最上方的 fb-config 區塊（寫在檔案裡的話每台裝置都自動帶入）。",
      file:"<b>目前：使用檔案內建設定</b>（HTML 最上方的 fb-config 區塊）。",
      device:"<b>目前：使用這台裝置貼的設定</b>，會蓋過檔案裡的。",

    };
    const u=FB&&FB.auth&&FB.auth.currentUser;

    } else if(!u){

    const r=importRows(ib().value,false);
    /* 把每一列帶的訂金狀態收斂成「一位客人一張訂單」 */

      if(i.kind==="buy"){
        const o=getOrder(i.tripId,i.customer||"");
        const t=touched[o.id]=touched[o.id]||{o,dep:0,anyDep:false,allBal:true,n:0};

    });

        migrateOrders();

        S.meta={backupAt:Date.now(), backupCount:d.items.length, ...(d.meta||{})};
        save(); rateNote(); render(); renderSettings(); uploadAll(); toast("已匯入 "+d.items.length+" 筆");
      }catch(err){ toast("這個檔案讀不出來，請確認是本工具匯出的備份"); }
    };
    fr.readAsText(f);
  };
  document.getElementById("wipeBtn").onclick=()=>{
    if(confirm("清空全部商品與設定？建議先匯出備份。")){

      S={items:[],trips:[],orders:[],checkouts:[],cur:"all",set:{...DEF_SET},meta:{backupAt:0,backupCount:0}}; save();
      olds.forEach(id=>cloudDel(id)); oldt.forEach(id=>cloudDelTrip(id));

/* ================= Firebase 同步（選用） =================
   沒設定或沒登入時，整個工具就是純本機版，功能不受影響。
   設定後：Firestore 的離線快取會在沒網路時先存本機，連上網自動補傳。 */
let FB=null, UID=null, unsubItems=null, unsubMeta=null, unsubTrips=null, unsubOrders=null, unsubCos=null, firstSnap=true, fbState="off";
let lastErr="", loadTimer=null, fallbackTimer=null, gotSnap=false;
function noteErr(where,e){
  lastErr=where+"："+(e&&(e.code||e.message)||e||"未知錯誤");
  console.warn(where,e);
}
const FBKEY=KEY+".fbcfg";
function builtinCfgText(){
  const e=document.getElementById("fb-config");
  return e ? (e.textContent||"").trim() : "";
}
function fbCfg(){
  try{
    const v=JSON.parse(localStorage.getItem(FBKEY)||"null");
    if(v&&v.apiKey) return v;         /* 這台裝置貼的優先 */
  }catch(e){}
  return parseFbCfg(builtinCfgText()); /* 其次用檔案裡的 */
}
function cfgSource(){
  try{ const v=JSON.parse(localStorage.getItem(FBKEY)||"null"); if(v&&v.apiKey) return "device"; }catch(e){}
  if(parseFbCfg(builtinCfgText())) return "file";
  return builtinCfgText() ? "bad" : "none";
}
/* Firebase 給的是 JS 物件寫法（key 沒引號），所以不能只靠 JSON.parse。
   這裡改成直接把需要的欄位抽出來，整段程式碼貼進來也能用。 */
function parseFbCfg(txt){
  if(!txt) return null;
  try{ const o=JSON.parse(txt); if(o&&o.apiKey&&o.projectId) return o; }catch(e){}
  const keys=["apiKey","authDomain","projectId","storageBucket","messagingSenderId","appId","measurementId","databaseURL"];
  const o={};
  keys.forEach(k=>{
    const m=txt.match(new RegExp("[\"']?"+k+"[\"']?\\s*:\\s*[\"']([^\"']+)[\"']"));
    if(m) o[k]=m[1];
  });
  return (o.apiKey&&o.projectId) ? o : null;
}
function setFbCfg(c){ if(c) localStorage.setItem(FBKEY,JSON.stringify(c)); else localStorage.removeItem(FBKEY); }

const FB_TXT={off:["本機",""],loading:["連線中…",""],ready:["未登入","warn"],
              syncing:["同步中…","ok"],synced:["已同步","ok"],
              offline:["離線中","warn"],error:["連線失敗","bad"]};
function paintCloud(){
  const b=document.getElementById("cloudBtn");
  if(typeof paintBanner==="function") setTimeout(paintBanner,0);
  if(!b) return;
  const [t,c]=FB_TXT[fbState]||FB_TXT.off;
  b.textContent=t; b.className="iconbtn"+(c?" "+c:"");
  b.title = fbState==="off" ? "尚未設定雲端同步，資料只存在這台裝置"
          : fbState==="ready" ? "點一下用 Google 登入開始同步" : "點一下開啟同步設定";
}
let cacheMode="unknown", retried=false, redirFailed=false;
/* iOS Safari 在隱私模式、儲存受限或主畫面 App 等情況下可能無法使用 IndexedDB，
   這時 Firestore 的離線快取會初始化失敗，連帶所有讀取都失敗。先測一次再決定。 */
function idbUsable(){
  return new Promise(res=>{
    try{
      if(!window.indexedDB) return res(false);
      const req=indexedDB.open("daigou_idb_probe");
      const done=v=>{ try{ if(req.result) req.result.close(); indexedDB.deleteDatabase("daigou_idb_probe"); }catch(e){} res(v); };
      req.onsuccess=()=>done(true);
      req.onerror=()=>done(false);
      req.onblocked=()=>done(false);
      setTimeout(()=>done(false),2000);
    }catch(e){ res(false); }
  });
}
/* 快取層出問題時，用一個獨立的 app 實例改走記憶體快取再試一次 */
async function retryWithMemoryCache(e){
  if(retried || cacheMode==="memory" || !FB) return;
  const msg=String((e&&(e.code||e.message))||"").toLowerCase();
  if(!/precondition|unimplemented|indexeddb|persistence|internal|unavailable/.test(msg)) return;
  retried=true;
  try{
    const F=window.__FB, cfg=fbCfg();
    const app2=F.initializeApp(cfg,"memfallback");
    const db2=F.initializeFirestore(app2,{experimentalAutoDetectLongPolling:true});
    FB={F,app:app2,db:db2,auth:FB.auth};
    cacheMode="memory"; lastErr+="（已自動改用記憶體快取重試）";
    toast("離線快取不可用，已改用線上模式");
    startSync();
  }catch(err){ noteErr("改用記憶體快取",err); }
}
async function cloudInit(){
  const cfg=fbCfg();
  if(!cfg){ fbState="off"; paintCloud(); return; }
  if(!window.__FB){ fbState="error"; paintCloud(); return; }
  const F=window.__FB;
  try{
    fbState="loading"; paintCloud();
    const app=F.initializeApp(cfg);
    const idbOk=await idbUsable();
    cacheMode = idbOk ? "persistent" : "memory";
    const opts = idbOk
      ? {localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()}),
         experimentalAutoDetectLongPolling:true}
      : {experimentalAutoDetectLongPolling:true};
    let db;
    try{ db=F.initializeFirestore(app,opts); }
    catch(e){ noteErr("建立快取("+cacheMode+")",e); cacheMode="memory";
              db=F.initializeFirestore(app,{experimentalAutoDetectLongPolling:true}); }
    const auth=F.getAuth(app);
    FB={F,app,db,auth};
    const pending=localStorage.getItem(KEY+".redir");
    F.getRedirectResult(auth).then(r=>{
      if(r&&r.user){ localStorage.removeItem(KEY+".redir"); return; }
      if(pending && !auth.currentUser){
        localStorage.removeItem(KEY+".redir");
        lastErr="轉址登入沒有帶回登入狀態"+(isStandalone()?"（主畫面 App ＋ 跨網域的已知限制）":"");
        redirFailed=true;
        setTimeout(()=>{ if(document.getElementById("fbPanel")) renderSettings(); },300);
      }
    }).catch(e=>{
      localStorage.removeItem(KEY+".redir");
      noteErr("轉址登入",e); redirFailed=true;
      setTimeout(()=>{ if(document.getElementById("fbPanel")) renderSettings(); },300);
    });
    clearTimeout(loadTimer);
    loadTimer=setTimeout(()=>{            /* 超過 12 秒還在連線中就當作失敗，不要一直轉 */
      if(fbState==="loading"||fbState==="syncing"){
        if(!lastErr) lastErr="連線逾時：Firestore 沒有回應，最常見原因是資料庫還沒建立";
        fbState="error"; paintCloud();
        if(document.getElementById("fbPanel")) renderSettings();
      }
    },12000);
    F.onAuthStateChanged(auth,u=>{
      UID=u?u.uid:null;
      if(UID){ firstSnap=true; fbState="syncing"; try{ startSync(); }catch(e){ noteErr("啟動同步",e); fbState="error"; } }
      else { stopSync(); fbState="ready"; }
      paintCloud();
      if(document.getElementById("fbPanel")) renderSettings();
    });
  }catch(e){
    noteErr("初始化 Firebase",e); FB=null; fbState="error"; paintCloud();
    toast("Firebase 設定有問題："+(e.message||e));
  }
}
function stopSync(){
  clearTimeout(fallbackTimer);
  if(unsubItems){unsubItems();unsubItems=null;}
  if(unsubMeta){unsubMeta();unsubMeta=null;}
  if(unsubTrips){unsubTrips();unsubTrips=null;}
  if(unsubOrders){unsubOrders();unsubOrders=null;}
  if(unsubCos){unsubCos();unsubCos=null;}
}
function startSync(){
  const {F,db}=FB; stopSync(); gotSnap=false;
  clearTimeout(fallbackTimer);
  fallbackTimer=setTimeout(async()=>{      /* 監聽沒回來就改用一次性讀取補救 */
    if(gotSnap) return;
    try{
      const qs=await F.getDocs(F.collection(db,"users",UID,"items"));
      const cloud=qs.docs.map(x=>x.data());
      if(cloud.length){ S.items=cloud; persist(); render(); }
      else if(S.items.length){ await uploadAll(); }
      gotSnap=true; clearTimeout(loadTimer); fbState="synced"; paintCloud();
      if(document.getElementById("fbPanel")) renderSettings();
    }catch(e){ noteErr("補抓資料",e); fbState="error"; paintCloud();
               if(document.getElementById("fbPanel")) renderSettings();
               retryWithMemoryCache(e); }
  },6000);
  unsubMeta=F.onSnapshot(F.doc(db,"users",UID,"sys","meta"),snap=>{
    if(snap.exists()){ const d=snap.data(); if(d&&d.set){ S.set={...DEF_SET,...d.set}; rateNote(); } }
  },e=>noteErr("讀取設定",e));

  unsubTrips=F.onSnapshot(F.collection(db,"users",UID,"trips"),snap=>{
    const cloud=snap.docs.map(d=>d.data());
    if(cloud.length){ S.trips=cloud; migrateTrips(); persist(); render(); }
  },e=>noteErr("讀取檔期",e));

  unsubOrders=F.onSnapshot(F.collection(db,"users",UID,"orders"),snap=>{
    const cloud=snap.docs.map(d=>d.data());
    if(cloud.length){ S.orders=cloud; persist(); render(); repaintTab(); }
  },e=>noteErr("讀取客人訂單",e));

  unsubCos=F.onSnapshot(F.collection(db,"users",UID,"checkouts"),snap=>{
    const cloud=snap.docs.map(d=>d.data());
    if(cloud.length){ S.checkouts=cloud; persist(); render(); repaintTab(); }
  },e=>noteErr("讀取結帳單",e));

  unsubItems=F.onSnapshot(F.collection(db,"users",UID,"items"),snap=>{
    clearTimeout(loadTimer);
    const cloud=snap.docs.map(d=>d.data());
    if(firstSnap){
      firstSnap=false;
      if(!cloud.length && S.items.length){                 /* 雲端空的：把本機傳上去 */
        uploadAll().then(()=>{ fbState="synced"; clearTimeout(loadTimer); paintCloud();
          if(document.getElementById("fbPanel")) renderSettings(); });
        return;
      }
      if(cloud.length && S.items.length && !sameSet(cloud,S.items)){
        const keepCloud=confirm(`雲端有 ${cloud.length} 筆，這台裝置有 ${S.items.length} 筆，內容不一致。\n\n按「確定」用雲端覆蓋這台；按「取消」把這台的資料也上傳合併。`);
        if(!keepCloud){
          uploadAll().then(()=>{ fbState="synced"; clearTimeout(loadTimer); paintCloud(); });
          return;
        }
      }
    }
    S.items=cloud; persist(); render();
    gotSnap=true; clearTimeout(loadTimer); clearTimeout(fallbackTimer);
    fbState = (snap.metadata.fromCache && navigator.onLine===false) ? "offline" : "synced";
    paintCloud();
    if(document.getElementById("fbPanel")) renderSettings();
  },e=>{ noteErr("讀取商品資料",e); fbState="error"; paintCloud();
         if(document.getElementById("fbPanel")) renderSettings();
         retryWithMemoryCache(e); });
}
const sameSet=(a,b)=>a.length===b.length && a.every(x=>b.some(y=>y.id===x.id));
/* Firestore 不接受 undefined，也有單筆 1MB 上限，寫入前先整理乾淨 */
function clean(o){
  const r={};
  for(const k in o){ const v=o[k]; if(v!==undefined) r[k]=v; }
  return r;
}
function tooBig(o){
  try{ return new Blob([JSON.stringify(o)]).size > 900*1024; }catch(e){ return false; }
}
async function uploadAll(){
  if(!UID) return;
  const {F,db}=FB;
  let okT=0, okI=0; const fail=[];
  for(const t of S.trips){
    try{ await F.setDoc(F.doc(db,"users",UID,"trips",t.id),clean(t)); okT++; }
    catch(e){ fail.push("檔期「"+(t.name||t.id)+"」："+(e.code||e.message)); }
  }
  for(const it of S.items){
    let body=clean(it);
    if(tooBig(body)){ body={...body,img:null}; fail.push("「"+(it.nameZh||it.id)+"」圖片太大，已改以無圖上傳"); }
    try{ await F.setDoc(F.doc(db,"users",UID,"items",it.id),body); okI++; }
    catch(e){ fail.push("「"+(it.nameZh||it.id)+"」："+(e.code||e.message)); }
  }
  for(const o of S.orders){
    try{ await F.setDoc(F.doc(db,"users",UID,"orders",o.id),clean(o)); }
    catch(e){ fail.push("訂單「"+(o.customer||o.id)+"」："+(e.code||e.message)); }
  }
  for(const c of S.checkouts){
    try{ await F.setDoc(F.doc(db,"users",UID,"checkouts",c.id),clean(c)); }
    catch(e){ fail.push("結帳單「"+(c.store||c.id)+"」："+(e.code||e.message)); }
  }
  try{ await cloudSettings(); }catch(e){ fail.push("設定："+(e.code||e.message)); }
  if(fail.length){
    lastErr="上傳問題 "+fail.length+" 項｜"+fail.slice(0,4).join("　/　");
    toast("上傳 "+okI+"/"+S.items.length+" 筆，有 "+fail.length+" 項問題，請按「診斷連線」查看");
  }else{
    toast("已上傳 "+okI+" 筆商品、"+okT+" 個檔期");
  }
  return {okI,okT,fail};
}
async function cloudPut(it){
  if(!UID||!it) return;
  let body=clean(it);
  if(tooBig(body)) body={...body,img:null};
  try{ await FB.F.setDoc(FB.F.doc(FB.db,"users",UID,"items",it.id),body); }
  catch(e){ noteErr("上傳「"+(it.nameZh||it.id)+"」",e); toast("這筆沒上傳成功："+(e.code||e.message)); }
}
async function cloudDel(id){
  if(!UID||!id) return;
  try{ await FB.F.deleteDoc(FB.F.doc(FB.db,"users",UID,"items",id)); }catch(e){ console.warn(e); }
}

/* ---------- 連線診斷：一次把每一步的結果列出來 ---------- */
async function runDiag(){
  const out=document.getElementById("fbDiagOut");
  if(!out) return;
  out.classList.remove("hide");
  const L=[]; const put=(k,v)=>{L.push(k.padEnd(14,"　")+" "+v); out.textContent=L.join("\n");};
  put("1 SDK 載入", window.__FB ? "✓ 成功" : "✗ 失敗（網路被擋，或 gstatic.com 連不上）");
  const src=cfgSource();
  put("2 設定來源", {none:"✗ 沒有設定",bad:"✗ 檔案裡的設定讀不出來",file:"✓ 檔案內建",device:"✓ 這台裝置貼的"}[src]);
  const c=fbCfg();
  put("3 專案 ID", c ? "✓ "+c.projectId : "✗ 讀不到");
  put("4 授權網域", c ? (location.hostname+"　→ 需在 Firebase 的 Authentication → Settings → 授權網域裡") : "—");
  put("4b authDomain", c ? (c.authDomain||"（未設定）") : "—");
  if(c&&c.authDomain) put("4c 轉址網址", "https://"+c.authDomain+"/__/auth/handler　→ 需在 Google Cloud 憑證的「已授權的重新導向 URI」裡");
  put("5 初始化", FB ? "✓ 成功" : "✗ 失敗");
  const u=FB&&FB.auth&&FB.auth.currentUser;
  put("6 登入狀態", u ? "✓ "+(u.email||u.uid) : "✗ 尚未登入");
  put("7 同步狀態", fbState);
  put("7b 本機快取", cacheMode==="persistent" ? "✓ 離線快取可用"
      : cacheMode==="memory" ? "⚠ 記憶體快取（線上正常，沒網路時不能同步）" : "未知");
  if(!FB||!u){ if(lastErr) put("最後錯誤","⚠ "+lastErr); put("結論","先把上面打叉的項目處理掉"); return; }
  put("8 使用者 ID", u.uid);
  put("9 讀寫測試", "執行中…");
  try{
    const {F,db}=FB;
    await F.setDoc(F.doc(db,"users",u.uid,"sys","diag"),{at:new Date().toISOString()});
    put("9 讀寫測試", "✓ 成功，Firestore 正常");
    const [qi,qt]=await Promise.all([
      F.getDocs(F.collection(db,"users",u.uid,"items")),
      F.getDocs(F.collection(db,"users",u.uid,"trips"))
    ]);
    put("10 雲端商品", qi.size+" 筆");
    put("11 雲端檔期", qt.size+" 個");
    put("12 本機商品", S.items.length+" 筆");
    if(qi.size===0 && S.items.length>0)
      put("結論","雲端是空的，資料還沒上傳。請按上面的「把這台的資料上傳」。");
    else if(qi.size>0 && S.items.length===0)
      put("結論","雲端有資料但這台沒抓下來。請按上面的「從雲端重新取回」。");
    else if(qi.size!==S.items.length)
      put("結論","雲端 "+qi.size+" 筆、本機 "+S.items.length+" 筆不一致，請擇一方向覆蓋。");
    else
      put("結論","雲端與本機一致，同步正常。");
    if(lastErr) put("最後錯誤","⚠ "+lastErr);
  }catch(e){
    const code=String(e&&e.code||"");
    put("9 讀寫測試", "✗ "+(e.code||e.message));
    let why="";
    if(code.includes("permission-denied")) why="安全規則擋住了。請到 Firestore → 規則，確認已貼上規則並按過「發佈」。";
    else if(code.includes("not-found")||code.includes("NOT_FOUND")) why="找不到資料庫。請到 Firestore → 建立資料庫（選 Standard、正式版模式）。";
    else if(code.includes("unavailable")) why="連不上 Firestore，可能是網路或防火牆擋住。";
    else if(code.includes("failed-precondition")) why="資料庫可能還沒建立，或建成了 Datastore 模式。";
    else why="把這段錯誤代碼貼給我看。";
    put("結論", why);
  }
}

async function cloudSignIn(){
  if(!FB){ toast("請先設定 Firebase（設定頁貼上，或填 HTML 最上方的 fb-config 區塊）"); return; }
  const {F,auth}=FB, prov=new F.GoogleAuthProvider();
  /* 主畫面 App 裡沒有彈出視窗可用，直接走轉址 */
  try{
    await F.signInWithPopup(auth,prov);   /* 部分 iOS 版本的主畫面 App 也支援，先試 */
  }catch(e){
    console.warn(e);
    const c=String(e.code||"");
    if(c.includes("popup")||c.includes("operation-not-supported")||c.includes("cancelled")){
      toast("改用轉址方式登入…");
      try{
        localStorage.setItem(KEY+".redir",String(Date.now()));
        await F.signInWithRedirect(auth,prov);
      }catch(e2){ localStorage.removeItem(KEY+".redir"); toast("登入失敗："+(e2.message||e2)); }
    } else {
      toast("登入失敗："+(e.message||e));
    }
  }
}

<script type="module">
/* Firebase 12.19.0 官方 CDN。放在主程式之後，module 預設 defer，所以主程式已經註冊好監聽 */
const V="12.19.0", B="https://www.gstatic.com/firebasejs/"+V+"/";
try{
  const [A,Au,Fs]=await Promise.all([
    import(B+"firebase-app.js"),
    import(B+"firebase-auth.js"),
    import(B+"firebase-firestore.js")
  ]);
  window.__FB={
    initializeApp:A.initializeApp,
    getAuth:Au.getAuth, GoogleAuthProvider:Au.GoogleAuthProvider,
    signInWithPopup:Au.signInWithPopup, signInWithRedirect:Au.signInWithRedirect,
    getRedirectResult:Au.getRedirectResult,
    signOut:Au.signOut, onAuthStateChanged:Au.onAuthStateChanged,
    initializeFirestore:Fs.initializeFirestore, persistentLocalCache:Fs.persistentLocalCache,
    persistentMultipleTabManager:Fs.persistentMultipleTabManager,
    doc:Fs.doc, setDoc:Fs.setDoc, deleteDoc:Fs.deleteDoc,
    collection:Fs.collection, onSnapshot:Fs.onSnapshot, getDocs:Fs.getDocs
  };
  window.dispatchEvent(new Event("fb-ready"));
}catch(e){
  console.warn("Firebase 載入失敗",e);
  window.dispatchEvent(new Event("fb-failed"));
}
</script>
